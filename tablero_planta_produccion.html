let activeRankingTab = 'general';
function renderRankingVentas(){
  // Ventas M1: de DB.ventas
  const statsM1 = {};
  DB.ventas.forEach(v=>{
    const p = DB.productos.find(pp=>pp.nombre===v.producto);
    if(!p) return;
    if(!statsM1[v.producto]) statsM1[v.producto]={nombre:v.producto, proteina:p.proteina, unidades:0, modelo:'M1'};
    statsM1[v.producto].unidades += v.unidades;
  });
  
  // Ventas M2: de DB.despachosM2
  const statsM2 = {};
  (DB.despachosM2||[]).forEach(d=>{
    d.items.forEach(it=>{
      if(!statsM2[it.nombre]) statsM2[it.nombre]={nombre:it.nombre, ptKey:it.ptKey, substock:it.substock, unidades:0, kgTeorico:0, modelo:'M2'};
      statsM2[it.nombre].unidades += it.unidades;
      statsM2[it.nombre].kgTeorico += it.kgTeorico||0;
    });
  });
  
  const listaM1 = Object.values(statsM1).sort((a,b)=>b.unidades-a.unidades);
  const listaM2 = Object.values(statsM2).sort((a,b)=>b.unidades-a.unidades);
  
  // General: combinar M1 + M2
  const general = {};
  [...listaM1,...listaM2].forEach(s=>{
    if(!general[s.nombre]) general[s.nombre]={nombre:s.nombre,unidades:0,modelos:[]};
    general[s.nombre].unidades += s.unidades;
    if(!general[s.nombre].modelos.includes(s.modelo)) general[s.nombre].modelos.push(s.modelo);
  });
  const listaGeneral = Object.values(general).sort((a,b)=>b.unidades-a.unidades);
  const maxGeneral = listaGeneral[0]?.unidades||1;
  const maxM1 = listaM1[0]?.unidades||1;
  const maxM2 = listaM2[0]?.unidades||1;
  
  function buildRankingHTML(lista, maxU, showKg){
    if(lista.length===0) return '<p style="color:#888;font-size:12px;text-align:center;padding:1rem">Sin datos</p>';
    return `<div style="display:flex;flex-direction:column;gap:6px">
      ${lista.map((s,i)=>{
        const pct = s.unidades/maxU*100;
        const color = i<3?'#1D9E75':i<7?'#EF9F27':'#aaa';
        return `<div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:#888;width:20px;text-align:right">${i+1}</span>
          <span style="font-size:12px;min-width:200px;flex:1">${s.nombre}</span>
          <div style="width:100px;background:#f0efe8;border-radius:4px;height:8px">
            <div style="width:${Math.min(pct,100)}%;background:${color};height:8px;border-radius:4px"></div>
          </div>
          <span style="font-size:12px;font-weight:600;min-width:45px;text-align:right">${s.unidades} u.</span>
          ${showKg&&s.kgTeorico?`<span style="font-size:11px;color:#888;min-width:55px">${fmt(s.kgTeorico,2)} kg</span>`:''}
          ${s.modelos?`<span style="font-size:10px;color:#888">${s.modelos.join('+')}</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }
  
  return `
  <div class="modo-tabs" style="max-width:400px">
    <button class="mtab${activeRankingTab==='general'?' active':''}" onclick="setRankingTab('general',this)">General</button>
    <button class="mtab${activeRankingTab==='m1'?' active':''}" onclick="setRankingTab('m1',this)">Modelo 1</button>
    <button class="mtab${activeRankingTab==='m2'?' active':''}" onclick="setRankingTab('m2',this)">Empresas</button>
  </div>
  <div class="card" id="ranking-general" style="display:${activeRankingTab==='general'?'block':'none'}">
    <div class="ctitle">Ranking general — M1 + Empresas</div>
    ${buildRankingHTML(listaGeneral, maxGeneral, false)}
  </div>
  <div class="card" id="ranking-m1" style="display:${activeRankingTab==='m1'?'block':'none'}">
    <div class="ctitle">Ranking Modelo 1 — Bolsas sous vide</div>
    ${buildRankingHTML(listaM1, maxM1, false)}
  </div>
  <div class="card" id="ranking-m2" style="display:${activeRankingTab==='m2'?'block':'none'}">
    <div class="ctitle">Ranking Empresas — Despacho viandas</div>
    ${buildRankingHTML(listaM2, maxM2, true)}
  </div>`;
}

function renderVentasHistorial(){
  // Filtrar última semana
  const hace7 = new Date(); hace7.setDate(hace7.getDate()-7);
  const ventasSemana = DB.ventas.filter(v=>new Date(v.fecha)>=hace7);
  if(ventasSemana.length===0) return '<p style="color:#888;text-align:center;padding:1rem">Sin ventas en la última semana. <button class="btn" style="font-size:11px" onclick="abrirHistVentas(0)">Ver historial completo →</button></p>';

  // Agrupar por batch_id; ventas sin batch_id se agrupan por fecha+producto
  const grupos = [];
  const vistoBatch = new Set();
  const vistoSingle = new Map(); // "fecha|producto" -> grupo

  ventasSemana.map(v=>({...v,_idx:DB.ventas.indexOf(v)})).reverse().forEach(v=>{
    if(v.batch_id){
      if(vistoBatch.has(v.batch_id)) return;
      vistoBatch.add(v.batch_id);
      const items = DB.ventas.map((vv,ii)=>({...vv,_idx:ii})).filter(vv=>vv.batch_id===v.batch_id);
      const totalU = items.reduce((s,vv)=>s+vv.unidades,0);
      grupos.push({tipo:'batch', batch_id:v.batch_id, fecha:v.fecha, usuario:v.usuario, items, totalU});
    } else {
      // Agrupar ventas sin batch_id por fecha+producto
      const key = v.fecha+'|'+v.producto;
      if(vistoSingle.has(key)){
        const g = vistoSingle.get(key);
        g.totalU += v.unidades;
        g.indices.push(v._idx);
        if(v.batch_id && !g.batch_id) g.batch_id = v.batch_id;
      } else {
        const g = {tipo:'single-group', key, fecha:v.fecha, producto:v.producto,
                   usuario:v.usuario, totalU:v.unidades, indices:[v._idx],
                   batch_id:v.batch_id||null};
        vistoSingle.set(key, g);
        grupos.push(g);
      }
    }
  });

  return grupos.map(g=>{
    if(g.tipo==='single-group'){
      // Ventas viejas sin batch_id agrupadas por fecha+producto
      const canDel = CU.role==='gerente';
      const delBtns = canDel ? g.indices.map(idx=>`<button class="btn-sm" onclick="delVenta(${idx});renderVentas()">x</button>`).join(' ') : '';
      return `<div style="border:1px solid #e5e7eb;border-radius:8px;margin-bottom:6px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:12px;padding:9px 14px;background:#fafafa">
          <span style="font-size:12px;color:#aaa">${fmtFecha(g.fecha)}</span>
          <span style="font-weight:500;flex:1">${g.producto}</span>
          <span style="font-size:12px;color:#666;margin-right:8px">${g.totalU} u.</span>
          ${canDel?`<button class="btn-sm" style="background:#fee2e2;color:#dc2626;border-color:#fca5a5" data-fecha="${fmtFecha(g.fecha)}" data-prod="${g.producto}" data-batch="${g.batch_id||''}" onclick="g_borrarGrupo(this)">Borrar grupo</button>`:''}
        </div>
      </div>`;
    }
    // Grupo batch
    const bid = g.batch_id;
    return `<div style="border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#f0f4ff;cursor:pointer"
           onclick="toggleBatch(${bid})">
        <span style="font-size:18px" id="batch-arrow-${bid}">▶</span>
        <span style="font-size:12px;color:#888">${fmtFecha(g.fecha)}</span>
        <span style="font-weight:600;flex:1">Importación — ${g.items.length} productos · ${g.totalU} u. totales</span>
        <span style="font-size:11px;color:#888">${g.usuario||''}</span>
        ${CU.role==='gerente'?`<button class="btn-sm" style="background:#fee2e2;color:#dc2626;border-color:#fca5a5"
          onclick="event.stopPropagation();delVentaBatch(${bid})">Borrar todo</button>`:''}
      </div>
      <div id="batch-detail-${bid}" style="display:none;padding:8px 14px">
        <table style="width:100%;font-size:12px">
          <thead><tr><th style="text-align:left">Producto</th><th>Unid.</th><th></th></tr></thead>
          <tbody>${g.items.map(vv=>`<tr>
            <td>${vv.producto}</td>
            <td style="text-align:center">${vv.unidades}</td>
            <td>${CU.role==='gerente'?`<button class="btn-sm" onclick="delVenta(${vv._idx})">x</button>`:''}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

let _confirmResolve=null;
function showConfirm(msg){
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    const ov=document.getElementById('confirm-overlay');
    document.getElementById('confirm-msg').textContent=msg;
    ov.style.display='flex';
  });
}
function resolveConfirm(val){
  document.getElementById('confirm-overlay').style.display='none';
  if(_confirmResolve){_confirmResolve(val);_confirmResolve=null;}
}

function g_borrarGrupo(btn){
  const fecha = btn.dataset.fecha;
  const prod = btn.dataset.prod;
  const bid = parseInt(btn.dataset.batch);
  if(bid) delVentaBatch(bid);
  else delVentasPorFechaProd(fecha, prod);
}

async function delVentasPorFechaProd(fecha, producto){
  const ok = await showConfirm(`¿Borrar todas las ventas de "${producto}" del ${fecha}?`);
  if(!ok) return;
  const aEliminar = DB.ventas.filter(v=>v.fecha===fecha && v.producto===producto && !v.batch_id);
  aEliminar.forEach(v=>{
    const p = DB.productos.find(pp=>pp.nombre===v.producto);
    if(v.ventaDirecta && v.substock) setSS(v.substock, getSS(v.substock)+(v.cantDescuentoSS||0));
    else if(p) setPT(p.ptKey, getPT(p.ptKey)+v.unidades);
    if(v.id) _deletedIds.add(String(v.id)); // marcar para que el merge no los restaure
  });
  DB.ventas = DB.ventas.filter(v=>!(v.fecha===fecha && v.producto===producto && !v.batch_id));
  await saveDB(); renderVentas(); checkAlertas();
}

async function delVentaBatch(batchId){
  const ok = await showConfirm('¿Borrar todas las ventas de esta importación?');
  if(!ok) return;
  // Revertir stock de cada venta del batch y marcar IDs como borrados
  DB.ventas.filter(v=>v.batch_id===batchId).forEach(v=>{
    const p=DB.productos.find(pp=>pp.nombre===v.producto);
    if(v.ventaDirecta && v.substock){
      setSS(v.substock, getSS(v.substock)+(v.cantDescuentoSS||0));
    } else if(p){
      setPT(p.ptKey, getPT(p.ptKey)+v.unidades);
    }
    if(v.id) _deletedIds.add(String(v.id)); // marcar para que el merge no los restaure
  });
  DB.ventas=DB.ventas.filter(v=>v.batch_id!==batchId);
  await saveDB(); renderVentas(); checkAlertas();
}

async function importarPedidos(){
  const fechaFiltro = document.getElementById('imp-fecha').value.trim();
  const fechaReg = document.getElementById('imp-fecha-registro').value;
  const prev = document.getElementById('imp-preview');
  if(!fechaFiltro){alert('Ingresá la fecha del pedido (ej: 21-4)');return;}
  prev.innerHTML=`<div style="color:#888;font-size:12px;padding:8px 0">Leyendo planilla...</div>`;

  // Buscar la pestaña que corresponde a esa fecha
  // Generar variantes del nombre de pestaña (espacio simple y doble)
  const [diaStr, mesStr] = fechaFiltro.split('-');
  const dia = parseInt(diaStr), mes = parseInt(mesStr);
  const variantes = [];
  for(const d of [diaStr, String(dia).padStart(2,'0')]){
    for(const m of [mesStr, String(mes).padStart(2,'0')]){
      variantes.push(`pedidos ${d}-${m}`);
      variantes.push(`pedidos  ${d}-${m}`);
    }
  }

  function parsearPlanilla(t){
    try{
      const json = JSON.parse(t.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
      return json.table?.rows || [];
    }catch(e){ return []; }
  }

  function tieneFechaCorrecta(rows, fechaFiltro){
    // En pestañas nuevas la fecha no aparece en las celdas, solo en el nombre.
    // Verificar que hay filas con datos reales (producto en col A o D)
    return rows.some(row=>{
      if(!row.c) return false;
      const colA = (row.c[0]?.f ?? row.c[0]?.v)?.toString().trim()||'';
      const colD = (row.c[3]?.f ?? row.c[3]?.v)?.toString().trim()||'';
      const tieneProducto = (colA.length > 5 && isNaN(Number(colA))) ||
                            (colD.length > 5 && isNaN(Number(colD)));
      return tieneProducto;
    });
  }

  let rawText = null, sheetName = null;
  for(const sn of variantes){
    try{
      const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sn)}`);
      const t = await r.text();
      if(!t.includes('"table"')) continue;
      const rows = parsearPlanilla(t);
      // Verificar que la pestaña tiene filas con la fecha correcta en columna A
      if(rows.length > 0 && tieneFechaCorrecta(rows, fechaFiltro)){
        rawText = t; sheetName = sn; break;
      }
    }catch(e){ continue; }
  }
  if(!rawText){
    prev.innerHTML=`<div class="alert-row">No se encontró la pestaña para "${fechaFiltro}". Verificá que exista en la planilla y que sea pública.</div>`;
    return;
  }
  try{
    // Google devuelve JSONP, hay que extraer el JSON
    const json = JSON.parse(rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows = json.table.rows;

    // Detectar estructura: producto en col A o D, cantidad en la última col con número
    // Formato abril: col D=producto, col E=cantidad
    // Formato mayo+: col A=producto, última columna=cantidad del pedido
    let colProd = 3, colCant = 4;
    const filasMuestra = rows.filter(r=>r.c&&r.c.some(c=>c));
    for(const row of filasMuestra){
      const colA = (row.c?.[0]?.f ?? row.c?.[0]?.v)?.toString().trim()||'';
      if(colA.length > 5 && isNaN(Number(colA)) &&
         !['base','producto','cliente','ur','concatenar'].includes(colA.toLowerCase())){
        // Formato mayo: producto en A, cantidad en la última celda no-nula
        colProd = 0;
        // Buscar la última columna con número en esta fila
        let lastNumCol = 4;
        for(let i=(row.c.length-1);i>0;i--){
          const v = row.c[i]?.v;
          if(v!==null && v!==undefined && !isNaN(Number(v)) && Number(v)>=0){
            lastNumCol = i; break;
          }
        }
        colCant = lastNumCol;
        break;
      }
    }

    const ignorar = new Set(['base','producto','total','cantidad','cliente','ur','concatenar','categoria']);
    const filas = [];
    rows.forEach(row=>{
      if(!row.c) return;
      const cProd = row.c[colProd];
      const cCant = row.c[colCant];
      if(!cProd || !cCant) return;
      const prod = (cProd.f ?? cProd.v)?.toString().trim();
      const cant = parseInt(cCant.v ?? cCant.f)||0;
      if(!prod || prod.length < 3 || cant <= 0) return;
      if(ignorar.has(prod.toLowerCase())) return;
      filas.push({prod, cant});
    });

    if(filas.length===0){
      prev.innerHTML=`<div class="alert-row">No se encontraron filas para la fecha "${fechaFiltro}".</div>`;
      return;
    }

    // Cruzar con productos del tablero via stockNombre
    function normalizarNombre(n){ return n.toLowerCase().trim().replace(/g$/, '').trim(); }
    const matcheados = [];
    const noMatcheados = {};
    filas.forEach(({prod:stockNombre, cant})=>{
      const prod = DB.productos.find(p=>{
        if(!p.stockNombre) return false;
        return normalizarNombre(p.stockNombre) === normalizarNombre(stockNombre);
      });
      if(prod){
        const stockActual = getPT(prod.ptKey);
        matcheados.push({prod, cant, stockActual, stockNombre});
      } else {
        noMatcheados[stockNombre] = (noMatcheados[stockNombre]||0)+cant;
      }
    });

    // Para el preview, agrupar por producto para mostrar resumen
    const resumenMatch = {};
    matcheados.forEach(({prod,cant,stockActual})=>{
      if(!resumenMatch[prod.ptKey]) resumenMatch[prod.ptKey]={prod,cant:0,stockActual};
      resumenMatch[prod.ptKey].cant+=cant;
    });

    // Guardar filas individuales para registrar
    window._importData = {matcheados, fechaReg};

    prev.innerHTML=`
    <div style="margin-top:12px">
      ${Object.values(resumenMatch).length>0?`
      <div style="font-size:11px;font-weight:500;color:#0c447c;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">✅ Productos que se van a registrar (${Object.values(resumenMatch).length})</div>
      <table style="margin-bottom:12px">
        <thead><tr><th>Producto</th><th>Unidades</th><th>Stock actual</th><th>Stock después</th></tr></thead>
        <tbody>${Object.values(resumenMatch).map(({prod,cant,stockActual})=>{
          const post=prod.ventaDirecta
            ? getSS(prod.substock)-(prod.cantVentaDirecta*cant)
            : stockActual-cant;
          return `<tr>
            <td>${prod.nombre}${prod.ventaDirecta?` <span class="badge bpurple">directo</span>`:''}</td>
            <td><strong>${cant}</strong></td>
            <td>${prod.ventaDirecta?fmt(getSS(prod.substock),2)+' kg':stockActual+' u.'}</td>
            <td><strong style="color:${post<0?'#a32d2d':post<=5?'#854f0b':'#0f6e56'}">${prod.ventaDirecta?fmt(post,2)+' kg':post+' u.'}</strong>${post<0?' ⚠️':''}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
      <button class="btn btn-primary" onclick="confirmarImport()">✅ Confirmar y registrar</button>`:''}

      ${Object.keys(noMatcheados).length>0?`
      <div style="font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-top:12px;margin-bottom:6px">⚠️ Sin mapeo (${Object.keys(noMatcheados).length})</div>
      <div style="font-size:11px;color:#888">${Object.entries(noMatcheados).map(([n,c])=>`<span style="display:inline-block;background:#f0efe8;border-radius:4px;padding:2px 8px;margin:2px">${n} (${c}u)</span>`).join('')}</div>
      <div style="font-size:11px;color:#888;margin-top:6px">Para mapearlos, agregá el "Nombre en planilla" en Configuración → Productos.</div>`:''}
    </div>`;
  }catch(e){
    console.error(e);
    prev.innerHTML=`<div class="alert-row">Error al leer la planilla. Verificá que sea pública (cualquiera con el link puede ver) y que la pestaña "pedidos ${fechaFiltro}" exista.</div>`;
  }
}

function confirmarImport(){
  const {matcheados, fechaReg} = window._importData||{};
  if(!matcheados||matcheados.length===0) return;
  const batchId = Date.now(); // ID compartido para toda esta importación
  let registradas=0;
  matcheados.forEach(({prod,cant})=>{
    if(prod.ventaDirecta){
      const descuento=parseFloat((prod.cantVentaDirecta*cant).toFixed(3));
      setSS(prod.substock, getSS(prod.substock)-descuento);
      DB.ventas.push({fecha:fechaReg,producto:prod.nombre,unidades:cant,usuario:CU.nombre,
        sp:null,sa:null,ventaDirecta:true,substock:prod.substock,cantDescuentoSS:descuento,
        importado:true,batch_id:batchId,id:batchId+Math.random()});
    } else {
      const sp=getPT(prod.ptKey);
      setPT(prod.ptKey, getPT(prod.ptKey)-cant);
      const sa=getPT(prod.ptKey);
      DB.ventas.push({fecha:fechaReg,producto:prod.nombre,unidades:cant,usuario:CU.nombre,
        sp,sa,importado:true,batch_id:batchId,id:batchId+Math.random()});
    }
    registradas+=cant;
  });
  saveDB();
  window._importData=null;
  alert(`✅ Se registraron ${registradas} unidades en ${matcheados.length} productos.`);
  renderVentas();checkAlertas();
}

function updateVentaInfo(){
  const pN=document.getElementById('v-prod')?.value||'';
  const uni=parseInt(document.getElementById('v-uni')?.value)||0;
  const p=DB.productos.find(pp=>pp.nombre===pN);
  const prev=document.getElementById('v-prev');if(!prev||!p)return;
  const kgTeo=calcKgMPTeorico(p);
  if(p.ventaDirecta){
    const ssDef=findSSdef(p.substock);
    const stockActual=getSS(p.substock);
    const cant=parseFloat((p.cantVentaDirecta*uni).toFixed(3));
    const post=stockActual-cant;
    const cls=post<0?'color:#a32d2d':post<=1?'color:#854f0b':'color:#0f6e56';
    prev.innerHTML=`<span class="badge bpurple">Armado en el momento</span> Descuenta de: <strong>${ssDef?.label||p.substock}</strong><br>
    Stock actual: <strong>${fmt(stockActual,2)} kg</strong> | A descontar: <strong>${fmt(cant,3)} kg</strong> → después: <strong style="${cls}">${fmt(post,2)} kg</strong>${post<0?' <span style="color:#a32d2d">— INSUFICIENTE</span>':''}`;
  } else {
    const sa=getPT(p.ptKey);
    const post=sa-uni;
    const cls=post<0?'color:#a32d2d':post<=5?'color:#854f0b':'color:#0f6e56';
    const kgTeoTotal=kgTeo*uni;
    prev.innerHTML=`Proteína: <strong>${p.proteina}</strong> | Stock actual: <strong>${sa}</strong> → después: <strong style="${cls}">${post}</strong>${post<0?' <span style="color:#a32d2d">— INSUFICIENTE</span>':''}<br>
    <span style="color:#888">kg MP teórico por porción: <strong>${fmt(kgTeo,3)} kg</strong> | Total para ${uni} u.: <strong>${fmt(kgTeoTotal,3)} kg</strong></span>`;
  }
}

function addVenta(){
  const fecha=document.getElementById('v-fecha').value;
  const pN=document.getElementById('v-prod').value;
  const uni=parseInt(document.getElementById('v-uni').value);
  if(!fecha||isNaN(uni)||uni<=0){alert('Completá todos los campos.');return;}
  const p=DB.productos.find(pp=>pp.nombre===pN);
  if(p&&p.ventaDirecta){
    // Descuenta directamente del sub-stock, no del PT
    const ssDef=findSSdef(p.substock);
    const cant=parseFloat((p.cantVentaDirecta*uni).toFixed(3));
    const stockActual=getSS(p.substock);
    if(stockActual<cant){if(!confirm(`Stock insuficiente en "${ssDef?.label}": ${fmt(stockActual,2)} kg disponibles. ¿Continuás?`))return;}
    setSS(p.substock, stockActual-cant);
    DB.ventas.push({fecha,producto:pN,unidades:uni,usuario:CU.nombre,sp:null,sa:null,ventaDirecta:true,substock:p.substock,cantDescuentoSS:cant,id:Date.now()});
  } else {
    const sp=p?getPT(p.ptKey):null;
    if(p&&getPT(p.ptKey)<uni){if(!confirm(`Stock insuficiente: ${getPT(p.ptKey)} u. ¿Continuás?`))return;}
    if(p)setPT(p.ptKey,getPT(p.ptKey)-uni);
    const sa=p?getPT(p.ptKey):null;
    DB.ventas.push({fecha,producto:pN,unidades:uni,usuario:CU.nombre,sp,sa,id:Date.now()});
  }
  saveDB();document.getElementById('v-uni').value='';renderVentas();checkAlertas();
}

function delVenta(i){
  if(CU.role!=='gerente')return;
  const v=DB.ventas[i];
  const p=DB.productos.find(pp=>pp.nombre===v.producto);
  if(v.ventaDirecta&&v.substock){
    // Devuelve al sub-stock
    setSS(v.substock,getSS(v.substock)+(v.cantDescuentoSS||0));
  } else if(p){
    setPT(p.ptKey,getPT(p.ptKey)+v.unidades);
  }
  DB.ventas.splice(i,1);saveDB();renderVentas();checkAlertas();
}

function renderBalance(){
  const el=document.getElementById('balance');
  let html=`<p class="sechead">Balance de masa por proteína</p>`;
  Object.keys(DB.substocks).forEach(prot=>{
    const kgBruto=DB.ingresos.filter(r=>r.proteina===prot).reduce((a,r)=>a+r.kg_bruto,0);
    const limpieza=DB.procesos.filter(r=>r.proteina===prot&&r.tipo==='limpieza');
    const coccion=DB.procesos.filter(r=>r.proteina===prot&&r.tipo==='coccion');
    const armado=DB.procesos.filter(r=>r.proteina===prot&&r.tipo==='armado');
    const kgDesp=limpieza.reduce((a,r)=>a+r.kg_desperdicio,0);
    const kgMerma=coccion.reduce((a,r)=>a+(r.kg_in-r.kg_out),0);
    const kgMermaApertura=DB.procesos.filter(r=>r.proteina===prot&&r.tipo==='apertura').reduce((a,r)=>a+r.kg_desperdicio,0);
    const kgRecA=armado.reduce((a,r)=>a+r.kg_desperdicio,0);
    const subsKg=DB.substocks[prot].filter(s=>s.type==='kg').reduce((a,s)=>a+getSS(s.key),0);
    const kgVendido=DB.ventas.reduce((a,v)=>{const p=DB.productos.find(pp=>pp.nombre===v.producto);return p&&p.proteina===prot?a+(calcKgMPTeorico(p)*v.unidades):a;},0);
    const totalExpl=kgDesp+kgMerma+kgMermaApertura+kgRecA+subsKg+kgVendido;
    const diff=kgBruto-totalExpl;
    const balanced=kgBruto===0||Math.abs(diff)<0.5;
    html+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="ctitle" style="margin-bottom:0">${prot}</div>
        <span class="badge ${balanced?'bok':Math.abs(diff)<2?'bwarn':'bdanger'}">${balanced?'Balanceado':'Desvío '+fmt(diff,2)+' kg'}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;font-size:12px">
        <div style="padding:8px;background:#f0efe8;border-radius:8px"><div style="font-size:10px;color:#888;margin-bottom:2px">Ingreso bruto</div><strong>${fmt(kgBruto,2)} kg</strong></div>
        <div style="padding:8px;background:#fcebeb;border-radius:8px"><div style="font-size:10px;color:#791f1f;margin-bottom:2px">Desperdicio</div><strong style="color:#791f1f">${fmt(kgDesp,2)} kg</strong></div>
        <div style="padding:8px;background:#faeeda;border-radius:8px"><div style="font-size:10px;color:#633806;margin-bottom:2px">Merma cocción</div><strong style="color:#633806">${fmt(kgMerma,2)} kg</strong></div>
        ${kgMermaApertura>0?`<div style="padding:8px;background:#faeeda;border-radius:8px"><div style="font-size:10px;color:#633806;margin-bottom:2px">Merma apertura bolsa</div><strong style="color:#633806">${fmt(kgMermaApertura,2)} kg</strong></div>`:''}
        ${kgRecA>0?`<div style="padding:8px;background:#faeeda;border-radius:8px"><div style="font-size:10px;color:#633806;margin-bottom:2px">Recorte armado</div><strong style="color:#633806">${fmt(kgRecA,2)} kg</strong></div>`:''}
        <div style="padding:8px;background:#eeedfe;border-radius:8px"><div style="font-size:10px;color:#3c3489;margin-bottom:2px">En sub-stocks kg</div><strong style="color:#3c3489">${fmt(subsKg,2)} kg</strong></div>
        <div style="padding:8px;background:#e1f5ee;border-radius:8px"><div style="font-size:10px;color:#085041;margin-bottom:2px">Vendido (kg MP teo)</div><strong style="color:#085041">${fmt(kgVendido,3)} kg</strong></div>
      </div>
      ${!balanced&&kgBruto>0?`<div style="margin-top:8px;font-size:11px;color:${Math.abs(diff)<2?'#633806':'#791f1f'}">Diferencia sin explicar: ${fmt(diff,2)} kg</div>`:''}
    </div>`;
  });
  el.innerHTML=html;
}

function showConfigTab(t,el){
  ['teorico','productos','productosM2'].forEach(k=>{
    const d=document.getElementById('config-'+k);
    if(d)d.style.display=k===t?'':'none';
  });
  document.querySelectorAll('#config .mtab').forEach(b=>b.classList.remove('active'));

function calcCostoKgPromedio(proteina, mes){
  // Promedio ponderado del costo de MP comprada (filtrado por mes si se pasa)
  let ings=DB.ingresos.filter(r=>r.proteina===proteina);
  if(mes)ings=ings.filter(r=>r.fecha&&r.fecha.slice(0,7)===mes);
  if(!ings.length)ings=DB.ingresos.filter(r=>r.proteina===proteina); // fallback todos
  const totalKg=ings.reduce((a,r)=>a+r.kg_bruto,0);
  const totalCosto=ings.reduce((a,r)=>a+(r.kg_bruto*(r.costo_kg||0)),0);
  return totalKg>0?totalCosto/totalKg:0;
}

function calcCostoUnitario(prod, mes){
  const kgTeo=calcKgMPTeorico(prod);
  const costoKg=calcCostoKgPromedio(prod.proteina, mes);
  return kgTeo*costoKg;
}

function renderFinanzas(){
  const el=document.getElementById('finanzas');
  if(!el)return;

  // Meses disponibles
  const mesesVentas=[...new Set(DB.ventas.map(v=>v.fecha?.slice(0,7)).filter(Boolean))].sort().reverse();
  const mesesIngresos=[...new Set(DB.ingresos.map(v=>v.fecha?.slice(0,7)).filter(Boolean))].sort().reverse();
  const meses=[...new Set([...mesesVentas,...mesesIngresos])].sort().reverse();
  const selMes=document.getElementById('fin-mes')?.value||meses[0]||'';

  // Ventas del período
  const ventasMes=selMes?DB.ventas.filter(v=>v.fecha?.slice(0,7)===selMes):DB.ventas;

  // Calcular por producto: unidades vendidas, ingreso, costo MP, food cost, CM
  const statsProducto={};
  DB.productos.forEach(p=>{
    const unidades=ventasMes.filter(v=>v.ptKey===p.ptKey).reduce((a,v)=>a+v.unidades,0);
    const precio=p.precio_venta||0;
    const costoU=calcCostoUnitario(p, selMes);
    const ingresoTotal=unidades*precio;
    const costoTotal=unidades*costoU;
    const cm=precio-costoU; // contribución marginal unitaria
    const cmTotal=unidades*cm;
    const fc=precio>0?costoU/precio*100:null;
    const markup=costoU>0?precio/costoU:null;
    statsProducto[p.ptKey]={prod:p,unidades,precio,costoU,ingresoTotal,costoTotal,cm,cmTotal,fc,markup};
  });

  // Totales del período
  const totalIngreso=Object.values(statsProducto).reduce((a,s)=>a+s.ingresoTotal,0);
  const totalCostoVentas=Object.values(statsProducto).reduce((a,s)=>a+s.costoTotal,0);
  const totalCM=Object.values(statsProducto).reduce((a,s)=>a+s.cmTotal,0);
  const fcGlobal=totalIngreso>0?totalCostoVentas/totalIngreso*100:0;

  // Valor del stock actual (PT)
  const stockValor=DB.productos.map(p=>{

function togglePerm(uid,tab,val){const u=DB.users.find(u=>u.id===uid);if(!u)return;u.perms[tab]=val;saveDB();}

function addUser(){
  const nombre=document.getElementById('nu-nombre').value.trim();
  const id=document.getElementById('nu-id').value.trim().replace(/\s/g,'');
  const pass=document.getElementById('nu-pass').value;
  const role=document.getElementById('nu-role').value;
  if(!nombre||!id||!pass){alert('Completá todos los campos.');return;}
  if(DB.users.find(u=>u.id===id)){alert('Ya existe un usuario con ese ID.');return;}
  const TABS=['resumen','ingreso','proceso','stock','ventas','balance','config','calidad','empleados','proveedores','finanzas'];
  const perms={admin:false};
  TABS.forEach(t=>perms[t]=role==='gerente'?true:['resumen','ingreso','proceso'].includes(t));
  DB.users.push({id,nombre,pass,role,perms});
  saveDB();renderAdmin();
}

function delUser(id){
  if(!confirm('¿Eliminar este usuario?'))return;
  DB.users=DB.users.filter(u=>u.id!==id);saveDB();renderAdmin();
}

function cambiarPass(){
  const uid=document.getElementById('pw-user').value;
  const nueva=document.getElementById('pw-nueva').value;
  if(!nueva){alert('Ingresá la nueva contraseña.');return;}
  const u=DB.users.find(u=>u.id===uid);if(!u)return;
  u.pass=nueva;saveDB();alert('Contraseña actualizada.');
  document.getElementById('pw-nueva').value='';
}

function addEmpleado(){
  const nombre=document.getElementById('emp-nombre').value.trim();
  if(!nombre){alert('Ingresá un nombre.');return;}
  if(!DB.empleados)DB.empleados=[];
  if(DB.empleados.includes(nombre)){alert('Ya existe ese empleado.');return;}
  DB.empleados.push(nombre);saveDB();renderAdmin();
}
function delEmpleado(i){
  DB.empleados.splice(i,1);saveDB();renderAdmin();
}

async function resetDatosOperativos(){
  const ok = await showConfirm(
    '¿Resetear todos los datos operativos? Se borrarán: stocks, procesos, ventas, ingresos, despachos, lotes y calidad. Se conservará toda la configuración. Esta acción NO se puede deshacer.'
  );
  if(!ok) return;
  const ok2 = await showConfirm('Última confirmación: ¿estás seguro?');
  if(!ok2) return;

  // Preservar configuración
  const {users, teorico, substocks, productos, productosM2, empleados, proveedores} = DB;

  // Construir DB limpia
  const dbLimpia = {
    ingresos: [],
    procesos: [],
    ventas: [],
    calidad: [],
    lotes: [],
    despachosM2: [],
    caidas: [],
    devoluciones: [],
    consumoInterno: [],
    ss: JSON.parse(JSON.stringify(DEFAULT_SS)),
    pt: JSON.parse(JSON.stringify(DEFAULT_PT)),
    users,
    teorico,
    substocks,
    productos,
    productosM2: productosM2||[],
    empleados: empleados||[],
    proveedores: proveedores||[],
  };

  // Guardar DIRECTO en Supabase sin merge
  const ok3 = await saveDBDirect(dbLimpia);
  if(!ok3){ alert('Error al guardar. Intentá de nuevo.'); return; }

  // Actualizar DB local
  DB = dbLimpia;
  _deletedIds = new Set();

  alert('✅ Datos operativos reseteados. La configuración fue preservada.');
  renderTab('resumen');
}

async function resetDB(){
  const ok = await showConfirm('¿Resetear ABSOLUTAMENTE TODO? Se perderá toda la configuración también.');
  if(!ok) return;
  const ok2 = await showConfirm('Última confirmación: esto borra usuarios, productos, sub-stocks y todos los datos. ¿Continuás?');
  if(!ok2) return;
  const dbLimpia = defaultDB();
  const ok3 = await saveDBDirect(dbLimpia);
  if(!ok3){ alert('Error al guardar. Intentá de nuevo.'); return; }
  DB = dbLimpia;
  _deletedIds = new Set();
  alert('Base reseteada completamente.');
  renderTab('resumen');
}

function exportarExcel(){
  const lines=['TABLERO DE PRODUCCIÓN — '+today(),'',
    '=== INGRESOS ===','Fecha\tProteína\tKg bruto\t$/kg\tCosto total\tProveedor\tUsuario'];
  DB.ingresos.forEach(r=>lines.push(`${fmtFecha(r.fecha)}\t${r.proteina}\t${fmt(r.kg_bruto,2)}\t${fmt(r.costo_kg,2)}\t${fmt(r.kg_bruto*r.costo_kg,2)}\t${r.proveedor||''}\t${r.usuario||''}`));
  lines.push('','=== PROCESOS ===','Fecha\tProteína\tTipo\tOrigen\tDestino\tEntrada\tSalida\tDesp./merma\tUnidades\tResponsable\tUsuario');
  DB.procesos.forEach(p=>lines.push(`${fmtFecha(p.fecha)}\t${p.proteina}\t${p.tipo}\t${p.origen||''}\t${p.destino||''}\t${fmt(p.kg_in,2)}\t${fmt(p.kg_out,2)}\t${fmt(p.kg_in-p.kg_out,2)}\t${p.unidades||''}\t${p.responsable||''}\t${p.usuario||''}`));
  lines.push('','=== VENTAS ===','Fecha\tProducto\tProteína\tUnidades\tkg MP teórico/u\tTotal kg MP teo\tStock prev.\tStock act.\tUsuario');
  DB.ventas.forEach(v=>{
    const p=DB.productos.find(pp=>pp.nombre===v.producto);
    const kgTeo=p?calcKgMPTeorico(p):null;
    lines.push(`${fmtFecha(v.fecha)}\t${v.producto}\t${p?p.proteina:''}\t${v.unidades}\t${kgTeo?fmt(kgTeo,3):''}\t${kgTeo?fmt(kgTeo*v.unidades,3):''}\t${v.sp??''}\t${v.sa??''}\t${v.usuario||''}`);
  });
  lines.push('','=== CALIDAD ===','Fecha\tCaídas\tPedidos\tErrores\t% error\tNotas\tUsuario');
  DB.calidad.forEach(r=>lines.push(`${fmtFecha(r.fecha)}\t${r.caidas}\t${r.pedidos}\t${r.errores}\t${r.pedidos>0?(r.errores/r.pedidos*100).toFixed(1):0}%\t${r.notas||''}\t${r.usuario||''}`));
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`planta_produccion_${today()}.xls`;a.click();
}

// ============================================================
// INIT
// ============================================================
function migrateDB(){
  // Migrar ss keys nuevos que no existen en Supabase
  Object.values(DEFAULT_SUBSTOCKS).flat().forEach(s=>{
    if(DB.ss[s.key]===undefined) DB.ss[s.key]=0;
  });
  // MIGRACIÓN FLUJO PECHUGA: renombrar keys viejas si existen con stock
  // pechuga_medallon_lpu → pechuga_lpu (mismo sub-stock, renombrado)
  if(DB.ss['pechuga_medallon_lpu']!==undefined && DB.ss['pechuga_lpu']===0){
    DB.ss['pechuga_lpu']=(DB.ss['pechuga_medallon_lpu']||0);
  }
  // pechuga_medallon_lpu_cocido → pechuga_lpu_cocido
  if(DB.ss['pechuga_medallon_lpu_cocido']!==undefined && DB.ss['pechuga_lpu_cocido']===0){
    DB.ss['pechuga_lpu_cocido']=(DB.ss['pechuga_medallon_lpu_cocido']||0);
  }
  // pechuga_medallon_lpu_cocido_abierto → pechuga_lpu_cocido_abierto
  if(DB.ss['pechuga_medallon_lpu_cocido_abierto']!==undefined && DB.ss['pechuga_lpu_cocido_abierto']===0){
    DB.ss['pechuga_lpu_cocido_abierto']=(DB.ss['pechuga_medallon_lpu_cocido_abierto']||0);
  }
  // Migrar aperturas de pechuga viejas: mover kg_out del cerrado al _abierto
  // Condición directa: aperturas cuyo substock_destino no termina en '_abierto'
  // (no depende de flags que pueden no haberse guardado aún en Supabase)
  if(DB.ss['pechuga_lpu_cocido_abierto']===0){
    const aperturasPechuga=(DB.procesos||[]).filter(p=>
      p.tipo==='apertura' &&
      (p.substock_origen==='pechuga_medallon_lpu_cocido'||p.substock_origen==='pechuga_lpu_cocido') &&
      !p.substock_destino?.endsWith('_abierto')
    );
    let totalAMover=0;
    aperturasPechuga.forEach(p=>{
      totalAMover+=p.kg_out||0;
      p.substock_destino='pechuga_lpu_cocido_abierto';
    });
    if(totalAMover>0){
      const kgEnCerrado=DB.ss['pechuga_lpu_cocido']||0;
      const kgAMover=Math.min(totalAMover, kgEnCerrado);
      DB.ss['pechuga_lpu_cocido']=Math.max(0, kgEnCerrado-kgAMover);
      DB.ss['pechuga_lpu_cocido_abierto']=kgAMover;
    }
  }
  // Migrar productos de pechuga: actualizar substock de medallones al nuevo
  if(DB.productos){
    const mapSubstock={
      'pechuga_medallon_170_cocido':'pechuga_lpu_cocido',
      'pechuga_medallon_250_cocido':'pechuga_lpu_cocido',
      'pechuga_medallon_lpu_cocido':'pechuga_lpu_cocido',
    };
    DB.productos.forEach(p=>{
      if(mapSubstock[p.substock]) p.substock=mapSubstock[p.substock];
    });
  }
  // Migrar sub-stocks nuevos que no existen en DB.substocks
  Object.entries(DEFAULT_SUBSTOCKS).forEach(([prot,subs])=>{
    if(!DB.substocks) DB.substocks={};
    if(!DB.substocks[prot]) DB.substocks[prot]=JSON.parse(JSON.stringify(subs));
    else {
      // Agregar sub-stocks nuevos que no están en Supabase
      subs.forEach(s=>{
        if(!DB.substocks[prot].find(ex=>ex.key===s.key)){
          DB.substocks[prot].push(JSON.parse(JSON.stringify(s)));
        }
      });
    }
  });
  // MIGRACIÓN PECHUGA: eliminar sub-stocks viejos que ya no se usan
  const pechugaObsoletos=['pechuga_medallon_170_crudo','pechuga_medallon_250_crudo',
    'pechuga_medallon_170_cocido','pechuga_medallon_250_cocido','pechuga_medallon_lpu',
    'pechuga_medallon_lpu_cocido','pechuga_medallon_lpu_cocido_abierto',
    'pechuga_cubos_crudo','pechuga_tiras_crudo',
    'pechuga_cubos_cocido','pechuga_tiras_cocido',
    'pechuga_cubos_cocido_abierto','pechuga_tiras_cocido_abierto'];
  if(DB.substocks&&DB.substocks['Pechuga']){
    DB.substocks['Pechuga']=DB.substocks['Pechuga'].filter(s=>!pechugaObsoletos.includes(s.key));
  }
  // Limpiar ss keys obsoletos de pechuga (poner a 0 y sacar de la vista)
  pechugaObsoletos.forEach(k=>{ delete DB.ss[k]; });
  
  // MIGRACIÓN GLOBAL: eliminar sub-stocks que no están en DEFAULT_SUBSTOCKS
  // (limpia cualquier key huérfano que quedó de versiones anteriores)
  const validSSKeys = new Set(Object.values(DEFAULT_SUBSTOCKS).flat().map(s=>s.key));
  Object.keys(DB.ss).forEach(k=>{ if(!validSSKeys.has(k)) delete DB.ss[k]; });
  
  // MIGRACIÓN SUBSTOCKS: reemplazar definición de proteína si cambió
  // (fuerza la versión actual del código sobre la guardada en Supabase)
  const proteinsToForce = ['Pechuga','Tapa de asado','Solomillo','Bondiola','Cuadril','Roast Beef','Peceto'];
  proteinsToForce.forEach(prot=>{
    if(DEFAULT_SUBSTOCKS[prot]) DB.substocks[prot]=JSON.parse(JSON.stringify(DEFAULT_SUBSTOCKS[prot]));
  });
  
  // MIGRACIÓN PRODUCTOS: forzar DEFAULT_PRODUCTOS (actualiza substocks, chains, etc.)
  DB.productos = JSON.parse(JSON.stringify(DEFAULT_PRODUCTOS));
  // Asegurar PT keys para nuevos productos
  DB.productos.forEach(p=>{
    if(!p.ventaDirecta && DB.pt[p.ptKey]===undefined) DB.pt[p.ptKey]=0;
  });
  if(!DB.teorico) DB.teorico=JSON.parse(JSON.stringify(DEFAULT_TEORICO));
  // Agregar proteínas nuevas al teórico si no existen
  Object.entries(DEFAULT_TEORICO).forEach(([prot,vals])=>{
    if(!DB.teorico[prot]) DB.teorico[prot]=JSON.parse(JSON.stringify(vals));
  });
  if(!DB.users) DB.users=JSON.parse(JSON.stringify(DEFAULT_USERS));
  if(!DB.empleados) DB.empleados=[];
  if(!DB.caidas) DB.caidas=[];
  if(!DB.devoluciones) DB.devoluciones=[];
  if(!DB.consumoInterno) DB.consumoInterno=[];
  if(!DB.lotes) DB.lotes=[];
  if(!DB.proveedores) DB.proveedores=[];
  // Crear lotes LEGACY para proteínas con stock pero sin lote registrado
  const prots=Object.keys(DB.substocks||{});
  prots.forEach(prot=>{
    const legacyId='LEGACY-'+prot.replace(/\s+/g,'-').toUpperCase();
    const yaExiste=DB.lotes.find(l=>l.lote_id===legacyId);
    if(yaExiste)return;
    // Ver si hay stock en algún sub-stock de esta proteína
    const subs=DB.substocks[prot]||[];
    const stockTotal=subs.reduce((acc,s)=>acc+getSS(s.key),0);
    // Ver si ya hay lotes reales para esta proteína
    const tieneLotsReales=DB.lotes.some(l=>l.proteina===prot&&!l.lote_id.startsWith('LEGACY'));
    if(stockTotal>0){
      DB.lotes.push({
        lote_id:legacyId,
        proteina:prot,
        fecha:'2000-01-01',
        kg_inicial:stockTotal,
        substock_origen:'',
        fecha_elab:'Anterior al sistema de lotes',
        venc_heladera:'—',
        venc_freezer:'—',
        es_legacy:true,
        id:Date.now()+Math.random()
      });
    }
  });
  // Migrar productos: actualizar ventaDirecta, cantVentaDirecta, stockNombre desde defaults
  if(!DB.productos) DB.productos=JSON.parse(JSON.stringify(DEFAULT_PRODUCTOS));
  else {
    // Agregar productos nuevos que no existen
    DEFAULT_PRODUCTOS.forEach(def=>{
      const exists=DB.productos.find(p=>p.ptKey===def.ptKey);
      if(!exists) DB.productos.push(JSON.parse(JSON.stringify(def)));
    });
    // Actualizar campos de productos existentes desde defaults
    DB.productos.forEach(p=>{
      const def=DEFAULT_PRODUCTOS.find(d=>d.ptKey===p.ptKey);
      if(!p.chain) p.chain=['limpieza','coccion'];
      if(!p.kgPorcion&&p.kgLPU) p.kgPorcion=p.kgLPU;
      if(p.stockNombre===undefined) p.stockNombre=def?.stockNombre||'';
      if(p.ventaDirecta===undefined&&def?.ventaDirecta) p.ventaDirecta=def.ventaDirecta;
      if(p.cantVentaDirecta===undefined&&def?.cantVentaDirecta) p.cantVentaDirecta=def.cantVentaDirecta;
      if(def?.substock&&p.substock!==def.substock&&def.ventaDirecta) p.substock=def.substock;
    });
  }
  // Agregar productos M2 nuevos que no existen
  if(!DB.productosM2) DB.productosM2=[];
  // Asegurar que PT keys existan (excepto ventaDirecta que no tienen stock propio)
  DB.productos.forEach(p=>{
    if(!p.ventaDirecta && DB.pt[p.ptKey]===undefined) DB.pt[p.ptKey]=0;
  });
  // Asegurar que sub-stocks nuevos existan con valor 0
  Object.values(DB.substocks).flat().forEach(s=>{
    if(DB.ss[s.key]===undefined) DB.ss[s.key]=0;
  });
  // Asegurar array de despachos empresas
  if(!DB.despachosM2) DB.despachosM2=[];
  // Flag para saber si hubo migraciones que requieren guardar directo
  DB._needsDirectSave = true;
  // MIGRACIÓN: aperturas viejas — substock_destino era igual a substock_origen (código viejo)
  // Solo corregir el campo substock_destino para trazabilidad, SIN mover kg
  // (los kg ya fueron usados en armados posteriores con el código viejo)
  (DB.procesos||[]).forEach(p=>{
    if(p.tipo==='apertura' && p.substock_origen && p.substock_destino===p.substock_origen){
      p.substock_destino=p.substock_origen+'_abierto';
      p._legacy_apertura=true; // marcar como apertura vieja para referencia
    }
  });
}
