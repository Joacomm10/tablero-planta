<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Producción</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:14px}
.app{max-width:1200px;margin:0 auto;padding:1rem}
.login-wrap{max-width:360px;margin:4rem auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px;background:#fff;border:1px solid #e5e5e0;border-radius:10px;padding:10px 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:8px;border:1px solid #d5d5d0;font-size:12px;cursor:pointer;background:transparent;color:#666}
.tab.active{background:#eef4fd;color:#1a56a0;font-weight:500;border-color:#93b8e8}
.sec{display:none}.sec.active{display:block}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.kcard{background:#f0efe8;border-radius:8px;padding:12px 14px}
.klabel{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.kval{font-size:20px;font-weight:500;color:#1a1a1a}
.ksub{font-size:11px;color:#888;margin-top:2px}
.kcard.ok .kval{color:#0f6e56}.kcard.warn .kval{color:#854f0b}.kcard.danger .kval{color:#a32d2d}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.ctitle{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.04em;padding:5px 6px;border-bottom:1px solid #f0efe8}
td{padding:7px 6px;border-bottom:1px solid #f0efe8;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;white-space:nowrap}
.bok{background:#e1f5ee;color:#085041}.bwarn{background:#faeeda;color:#633806}.bdanger{background:#fcebeb;color:#791f1f}.binfo{background:#e6f1fb;color:#0c447c}.bgray{background:#f1efe8;color:#444}.bpurple{background:#eeedfe;color:#3c3489}.bteal{background:#e1f5ee;color:#085041}
.frow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px;flex:1;min-width:90px}
.fg label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.04em}
input,select{padding:7px 9px;font-size:12px;border-radius:8px;border:1px solid #d5d5d0;background:#fff;color:#1a1a1a;width:100%}
input[type=password]{letter-spacing:2px}
input:focus,select:focus{outline:none;border-color:#93b8e8;box-shadow:0 0 0 3px rgba(55,138,221,0.1)}
.btn{padding:7px 16px;border-radius:8px;border:1px solid #d5d5d0;background:#f0efe8;color:#1a1a1a;font-size:12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:#e5e5e0}
.btn-primary{background:#e6f1fb;color:#0c447c;border-color:#93b8e8}
.btn-primary:hover{background:#d0e5f8}
.btn-danger{background:#fcebeb;color:#791f1f;border-color:#f09595}
.btn-sm{padding:2px 8px;font-size:10px;border-radius:6px;border:1px solid #e0e0da;background:transparent;color:#888;cursor:pointer}
.btn-sm:hover{background:#f0efe8}
.alert-row{background:#faeeda;border:1px solid #f0a020;border-radius:8px;padding:8px 12px;font-size:12px;color:#633806;margin-bottom:6px}
.sechead{font-size:15px;font-weight:500;color:#1a1a1a;margin-bottom:1rem}
.bar-wrap{height:6px;background:#f0efe8;border-radius:3px;overflow:hidden;margin-top:3px}
.bar{height:100%;border-radius:3px}
.prot-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.ptab{padding:4px 12px;border-radius:99px;border:1px solid #d5d5d0;font-size:11px;cursor:pointer;background:transparent;color:#666}
.ptab.active{background:#e6f1fb;color:#0c447c;border-color:#93b8e8;font-weight:500}
.modo-tabs{display:flex;gap:0;margin-bottom:1rem;border:1px solid #d5d5d0;border-radius:8px;overflow:hidden}
.mtab{flex:1;padding:9px;font-size:12px;cursor:pointer;background:transparent;color:#666;border:none;border-right:1px solid #d5d5d0;text-align:center}
.mtab:last-child{border-right:none}
.mtab.active{background:#e6f1fb;color:#0c447c;font-weight:500}
.user-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:#666}
.user-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;background:#e6f1fb;color:#0c447c}
.substk{padding:6px 10px;background:#f0efe8;border-radius:8px;font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.substk-low{background:#faeeda}
.substk-zero{background:#fcebeb}
.info-box{background:#f0efe8;border-radius:8px;padding:8px 12px;font-size:11px;color:#666;margin-bottom:10px}
.section-2col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:700px){.section-2col{grid-template-columns:1fr}}
.pill-kg{background:#e6f1fb;color:#0c447c;font-size:10px;padding:1px 6px;border-radius:99px;margin-left:4px}
.pill-u{background:#eeedfe;color:#3c3489;font-size:10px;padding:1px 6px;border-radius:99px;margin-left:4px}
.month-filter{display:flex;align-items:center;gap:8px;margin-bottom:1rem;font-size:12px}
/* ---- IMPRESIÓN DE ETIQUETAS ---- */
#print-area{display:none}
@media print{
  @page{size:120mm 50mm;margin:0}
  body > *{display:none !important}
  #print-area{display:block !important;margin:0;padding:0}
  .etiqueta-print{
    width:120mm;height:50mm;
    padding:4mm 5mm;
    display:flex;flex-direction:column;justify-content:space-between;
    page-break-after:always;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .ep-lote{font-size:20pt;font-weight:800;color:#000;letter-spacing:.04em;line-height:1}
  .ep-tipo{font-size:9pt;font-weight:600;color:#333;margin-top:1mm}
  .ep-prot{font-size:8pt;color:#555;margin-top:.5mm}
  .ep-divider{border:none;border-top:1px solid #aaa;margin:1.5mm 0}
  .ep-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5mm 4mm}
  .ep-item{font-size:7pt}
  .ep-item-label{color:#666;display:block;font-size:6pt;text-transform:uppercase;letter-spacing:.03em}
  .ep-item-val{font-weight:700;color:#000;font-size:8pt}
  .ep-warn{color:#5a2d00}
  .ep-ok{color:#003d2b}
}
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.panel-overlay.open{opacity:1;pointer-events:all}
.panel-lateral{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:95vw;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,0.12);z-index:101;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
.panel-lateral.open{transform:translateX(0)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #f0efe8;position:sticky;top:0;background:#fff;z-index:1}
.panel-body{padding:18px;flex:1}
.panel-close{width:28px;height:28px;border-radius:50%;border:1px solid #e5e5e0;background:#f0efe8;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#666}
.panel-close:hover{background:#e5e5e0}
/* Drawer de historial completo */
.hist-drawer{position:fixed;top:0;right:-100%;width:min(720px,100vw);height:100vh;background:#fff;box-shadow:-4px 0 32px rgba(0,0,0,0.15);z-index:300;display:flex;flex-direction:column;transition:right .25s cubic-bezier(.4,0,.2,1)}
.hist-drawer.open{right:0}
.hist-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e5e0;flex-shrink:0}
.hist-drawer-title{font-size:15px;font-weight:600;color:#1a1a1a}
.hist-drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.hist-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:299;display:none}
.hist-drawer-overlay.open{display:block}
/* Paginación */
.pag-bar{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px 0;font-size:12px}
.pag-btn{padding:4px 10px;border:1px solid #d5d5d0;border-radius:6px;background:#fff;cursor:pointer;font-size:12px}
.pag-btn:hover{background:#f5f5f0}
.pag-btn:disabled{opacity:.4;cursor:default}
.pag-info{color:#888}
.combo-wrap{position:relative;width:100%}
.combo-input{padding:7px 9px;font-size:12px;border-radius:8px;border:1px solid #d5d5d0;background:#fff;color:#1a1a1a;width:100%}
.combo-input:focus{outline:none;border-color:#93b8e8;box-shadow:0 0 0 3px rgba(55,138,221,0.1)}
.det-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f8f8f5;font-size:12px}
.det-row:last-child{border-bottom:none}
.det-label{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.det-val{font-weight:500;text-align:right;max-width:60%}
.det-dist-item{display:flex;justify-content:space-between;padding:5px 8px;background:#f0efe8;border-radius:6px;font-size:11px;margin-bottom:4px}
tr.proc-row{cursor:pointer}
tr.proc-row:hover td{background:#f8f8f5}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="app" id="app"></div>
<div id="print-area"></div>
<!-- MODAL DE CONFIRMACIÓN (reemplaza confirm() nativo) -->
<div id="confirm-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:24px 28px;max-width:380px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.18)">
    <div id="confirm-msg" style="font-size:14px;color:#1a1a1a;margin-bottom:20px;line-height:1.5"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="confirm-cancel" onclick="resolveConfirm(false)">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok" onclick="resolveConfirm(true)">Confirmar</button>
    </div>
  </div>
</div>
<div class="panel-overlay" id="panel-overlay" onclick="cerrarPanel()"></div>
<div class="hist-drawer-overlay" id="hist-drawer-overlay" onclick="cerrarHistDrawer()"></div>
<div class="hist-drawer" id="hist-drawer">
  <div class="hist-drawer-header">
    <span class="hist-drawer-title" id="hist-drawer-title">Historial completo</span>
    <button class="panel-close" onclick="cerrarHistDrawer()">✕</button>
  </div>
  <div class="hist-drawer-body" id="hist-drawer-body"></div>
</div>
<div class="panel-lateral" id="panel-lateral">
  <div class="panel-header">
    <div style="font-size:13px;font-weight:500;color:#1a1a1a" id="panel-title">Detalle del proceso</div>
    <button class="panel-close" onclick="cerrarPanel()">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<script>
// ============================================================
// DEFINICIONES BASE
// ============================================================

// Rendimientos teóricos
// desp_limpieza_pct = % que se tira en limpieza
// coccion_pct = % que queda después de cocinar (rendimiento)
const DEFAULT_TEORICO = {
  'Tapa de asado': {desp_limpieza_pct:43.8, coccion_pct:63.3},
  'Pechuga':       {desp_limpieza_pct:3.5,  coccion_pct:80.0},
  'Solomillo':     {desp_limpieza_pct:15.5, coccion_pct:81.4},
  'Bondiola':      {desp_limpieza_pct:1.2,  coccion_pct:58.3},
  'Lomo':          {desp_limpieza_pct:19.7, coccion_pct:null},
  'Cuadril':       {desp_limpieza_pct:25.6, coccion_pct:74.7},
  'Roast Beef':    {desp_limpieza_pct:10.0, coccion_pct:70.0},
};

// SUB_STOCKS
// type: 'kg' | 'u'
// estado: 'mp' | 'lpu' | 'crudo' | 'cocido'
// feeds: array de estados que este sub-stock puede alimentar (para lógica de limpieza)
const DEFAULT_SUBSTOCKS = {
  'Tapa de asado': [
    {key:'tapa_mp',            label:'Tapa de asado (entera)',    estado:'mp',    type:'kg', color:'#f1efe8', tc:'#444'},
    {key:'tapa_brisket_crudo', label:'Brisket crudo',             estado:'crudo', type:'kg', color:'#e6f1fb', tc:'#0c447c'},
    {key:'tapa_recortes_crudo',label:'Recortes tapa crudo',       estado:'crudo', type:'kg', color:'#faeeda', tc:'#633806'},
    {key:'tapa_brisket_cocido',label:'Brisket cocido',            estado:'cocido',type:'kg', color:'#e1f5ee', tc:'#085041'},
    {key:'tapa_brisket_cocido_abierto',label:'Brisket cocido (abierto)', estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
    {key:'tapa_recortes_cocido',label:'Recortes tapa cocido',     estado:'cocido',type:'kg', color:'#eaf3de', tc:'#27500a'},
    {key:'tapa_recortes_cocido_abierto',label:'Recortes tapa cocido (abierto)', estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
  ],
  'Pechuga': [
    {key:'pechuga_mp',              label:'Pechuga (entera)',                  estado:'mp',    type:'kg', color:'#f1efe8', tc:'#444'},
    {key:'pechuga_lpu',             label:'Pechuga LPU (limpia, kg)',          estado:'lpu',   type:'kg', color:'#eeedfe', tc:'#3c3489'},
    {key:'pechuga_recortes',        label:'Pechuga recortes (kg)',             estado:'crudo', type:'kg', color:'#faeeda', tc:'#633806'},
    {key:'pechuga_lpu_cocido',      label:'Pechuga LPU cocida (cerrado)',      estado:'cocido',type:'kg', color:'#e1f5ee', tc:'#085041'},
    {key:'pechuga_lpu_cocido_abierto',label:'Pechuga LPU cocida (abierto)',   estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
    {key:'pechuga_recortes_cocido', label:'Recortes pechuga cocidos (cerrado)',        estado:'cocido',type:'kg', color:'#eaf3de', tc:'#27500a'},
    {key:'pechuga_recortes_cocido_abierto',label:'Recortes pechuga cocidos (abierto)',estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
  ],
  'Solomillo': [
    {key:'solomillo_mp',              label:'Solomillo (entero)',       estado:'mp',    type:'kg', color:'#f1efe8', tc:'#444'},
    {key:'solomillo_medallon_170_crudo',label:'Medallones crudos 170g',estado:'crudo', type:'u',  gramos:170, color:'#e6f1fb', tc:'#0c447c'},
    {key:'solomillo_tiras_crudo',     label:'Tiras crudas',            estado:'crudo', type:'kg', color:'#faeeda', tc:'#633806'},
    {key:'solomillo_medallon_170_cocido',label:'Medallones cocidos 170g',estado:'cocido',type:'u',gramos:170, color:'#e1f5ee', tc:'#085041'},
    {key:'solomillo_tiras_cocido',    label:'Tiras cocidas',           estado:'cocido',type:'kg', color:'#eaf3de', tc:'#27500a'},
    {key:'solomillo_tiras_cocido_abierto',label:'Tiras cocidas (abierto)', estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
  ],
  'Bondiola': [
    {key:'bondiola_mp',           label:'Bondiola (entera)',            estado:'mp',    type:'kg', color:'#f1efe8', tc:'#444'},
    {key:'bondiola_lpu',          label:'Bondiola LPU (limpia)',        estado:'lpu',   type:'kg', color:'#e6f1fb', tc:'#0c447c'},
    {key:'bondiola_cocida_medallon',label:'Bondiola cocida (medallón)',  estado:'cocido',type:'kg', color:'#e1f5ee', tc:'#085041'},
    {key:'bondiola_cocida_medallon_abierto',label:'Bondiola cocida medallón (abierto)', estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
    {key:'bondiola_cocida_pulled', label:'Bondiola cocida (pulled pork)',estado:'cocido',type:'kg', color:'#eaf3de', tc:'#27500a'},
    {key:'bondiola_cocida_pulled_abierto',label:'Bondiola pulled (abierto)', estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
  ],
  'Lomo': [
    {key:'lomo_mp',               label:'Lomo (entero)',                estado:'mp',    type:'kg', color:'#f1efe8', tc:'#444'},

  'Roast Beef': [

    {key:'roastbeef_lpu',         label:'Roast Beef LPU (limpio)',           estado:'lpu',   type:'kg', color:'#eeedfe', tc:'#3c3489'},
    {key:'roastbeef_lpu_cocido',  label:'Roast Beef LPU cocido (cerrado)',   estado:'cocido',type:'kg', color:'#e1f5ee', tc:'#085041'},
    {key:'roastbeef_lpu_cocido_abierto',label:'Roast Beef LPU cocido (abierto)', estado:'abierto',type:'kg', color:'#fff3cd', tc:'#856404'},
  ],
  'Peceto': [
    {key:'peceto_mp',           label:'Peceto (entero)',        estado:'mp',    type:'kg', color:'#f1efe8', tc:'#444'},
    {key:'peceto_milanesa_lpu', label:'Milanesa LPU (limpia)',  estado:'lpu',   type:'kg', color:'#e6f1fb', tc:'#0c447c'},
    {key:'peceto_recortes',     label:'Recortes peceto',        estado:'crudo', type:'kg', color:'#faeeda', tc:'#633806'},
  ]

// PRODUCTOS
// kgLPU = kg de MP original por unidad (se calculará automáticamente cuando haya rendimientos)
// substock = de donde se descuenta al armar
// chain = cadena de procesos que arrastra para calcular kgLPU real
//   'mp->lpu->crudo->cocido' etc.
const DEFAULT_PRODUCTOS = [
  // Tapa de asado — armado solo desde abierto
  {nombre:'Ternera braseada - 150g',   proteina:'Tapa de asado', kgPorcion:0.150, substock:'tapa_brisket_cocido_abierto',    chain:['limpieza','coccion','apertura'], ptKey:'Ternera braseada 150g',    stockNombre:'Ternera braseada al horno - 150g'},
  {nombre:'Ternera braseada - 200g',   proteina:'Tapa de asado', kgPorcion:0.200, substock:'tapa_brisket_cocido_abierto',    chain:['limpieza','coccion','apertura'], ptKey:'Ternera braseada 200g',    stockNombre:'Ternera braseada al horno - 200g'},
  {nombre:'Goulash - 200g',            proteina:'Tapa de asado', kgPorcion:0.164, substock:'tapa_recortes_cocido_abierto',   chain:['limpieza','coccion','apertura'], ptKey:'Goulash 200g',             stockNombre:'Goulash - 200g'},
  {nombre:'Pulled Beef - 250g',        proteina:'Tapa de asado', kgPorcion:0.263, substock:'tapa_recortes_cocido_abierto',   chain:['limpieza','coccion','apertura'], ptKey:'Pulled Beef 250g',         stockNombre:'Pulled Beef - 250g'},
  // Pechuga — armado solo desde abierto
  {nombre:'Pechuga con limón - 170g',  proteina:'Pechuga', kgPorcion:0.170, substock:'pechuga_lpu_cocido_abierto', chain:['limpieza','coccion','apertura'], ptKey:'Pechuga limón 170g',    stockNombre:'Pechuga con limón - 170g'},

async function _doSaveDB(){
  try{
    // 1. Leer estado actual de Supabase
    const r=await fetch(`${SB_URL}/rest/v1/datos?id=eq.${SB_RECORD_ID}&select=valor`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}

      // 2. Merge: para arrays con id, combinar ambos y deduplicar por id
      //    Para objetos planos (ss, pt, teorico), prevalece el local (el usuario acaba de cambiar algo)
      mergedDB={
        ...remote,          // base remota (preserva todo lo que otro usuario haya guardado)
        ss:DB.ss,           // stock: prevalece local (operación actual)
        pt:DB.pt,
        teorico:DB.teorico,
        substocks:DB.substocks,
        productos:DB.productos,
        productosM2:DB.productosM2,
        users:DB.users,
        empleados:DB.empleados,
        // Arrays: unir remoto + local, deduplicar por id, el más reciente gana
        ingresos:mergeArrayById(remote.ingresos||[], DB.ingresos||[]),
        procesos:mergeArrayById(remote.procesos||[], DB.procesos||[]),
        ventas:mergeArrayById(remote.ventas||[], DB.ventas||[]),
        calidad:mergeArrayById(remote.calidad||[], DB.calidad||[]),
        lotes:mergeArrayById(remote.lotes||[], DB.lotes||[]),
        proveedores:mergeArrayById(remote.proveedores||[], DB.proveedores||[]),
        caidas:mergeArrayById(remote.caidas||[], DB.caidas||[]),
        devoluciones:mergeArrayById(remote.devoluciones||[], DB.devoluciones||[]),
        consumoInterno:mergeArrayById(remote.consumoInterno||[], DB.consumoInterno||[]),
        despachosM2:mergeArrayById(remote.despachosM2||[], DB.despachosM2||[]),
      };
      // Actualizar DB local con el merge para que todos los usuarios vean consistencia
      Object.assign(DB, mergedDB);
    }
    // 3. Guardar el merge en Supabase
    await fetch(`${SB_URL}/rest/v1/datos`,{

function mergeArrayById(remote, local){
  // Une dos arrays, deduplicando por id. En caso de conflicto, local gana.
  // Los IDs en _deletedIds se ignoran aunque estén en el remoto (para que los borrados persistan).
  const map=new Map();
  remote.forEach(item=>{if(item.id&&!_deletedIds.has(String(item.id)))map.set(item.id,item);});
  local.forEach(item=>{if(item.id)map.set(item.id,item);});
  // Items sin id: solo del local (los remotos sin id podrían ser duplicados)
  const sinId=local.filter(i=>!i.id);
  return [...map.values(),...sinId];
}

// Combo predictivo: reemplaza un <select id=ID> por input+datalist
// Uso: makeCombo('id', [{value, label}], valorActual, onchangeFn)
function makeCombo(id, opciones, valorActual, onchangeFn){
  const wrap = document.createElement('div');
  wrap.className = 'combo-wrap';
  const listId = id+'-list';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'combo-input';
  input.id = id;
  input.setAttribute('list', listId);
  input.setAttribute('autocomplete', 'off');
  // Mostrar el label del valor actual
  const found = opciones.find(o=>o.value===valorActual);
  input.value = found ? found.label : (valorActual||'');
  if(onchangeFn) input.addEventListener('input', ()=>{
    // Resolver value real desde el label escrito
    const match = opciones.find(o=>o.label===input.value||o.value===input.value);
    if(match) input.dataset.value = match.value;
    else input.dataset.value = '';
    onchangeFn(input.dataset.value || input.value);
  });
  const dl = document.createElement('datalist');
  dl.id = listId;
  opciones.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.label;
    dl.appendChild(opt);
  });
  wrap.appendChild(input);
  wrap.appendChild(dl);
  return wrap;
}

// Helper para obtener el value de un combo (puede ser data-value o value directo)
function getComboValue(id){
  const el = document.getElementById(id);
  if(!el) return '';
  // Si tiene data-value seteado por el combo, usarlo
  if(el.dataset.value !== undefined && el.dataset.value !== '') return el.dataset.value;
  // Si es un select normal
  if(el.tagName === 'SELECT') return el.value;
  // Si es un input, intentar matchear con opciones del datalist
  const listId = el.getAttribute('list');
  if(listId){
    const dl = document.getElementById(listId);
    if(dl){
      // Buscar option que coincida con el texto escrito
      const opts = Array.from(dl.options);
      // El input guarda el label, necesitamos el value original
      // Para eso usamos el data-value que se setea en oninput
      return el.dataset.value || el.value;
    }
  }
  return el.value;
}

// Calcula kg de MP original que representa 1 unidad de un producto
// teniendo en cuenta la cadena de mermas
function calcKgMPTeorico(prod){
  const teo=DB.teorico[prod.proteina];
  if(!teo) return prod.kgPorcion;
  let kg=prod.kgPorcion;
  // Si pasa por coccion, revertir merma coccion
  if(prod.chain.includes('coccion')&&teo.coccion_pct){
    kg=kg/(teo.coccion_pct/100);
  }
  // Revertir desperdicio limpieza
  if(prod.chain.includes('limpieza')&&teo.desp_limpieza_pct){
    const rend=(100-teo.desp_limpieza_pct)/100;
    kg=kg/rend;
  }
  return kg;
}

// Calcula kg de MP real consumidos por unidad basado en procesos registrados
function calcKgMPReal(proteina){
  const procs=DB.procesos.filter(p=>p.proteina===proteina);
  const limpiezas=procs.filter(p=>p.tipo==='limpieza');
  const cocciones=procs.filter(p=>p.tipo==='coccion');
  const kgIn=limpiezas.reduce((a,p)=>a+p.kg_in,0);
  const kgDesp=limpiezas.reduce((a,p)=>a+p.kg_desperdicio,0);
  const kgCocIn=cocciones.reduce((a,p)=>a+p.kg_in,0);
  const kgCocOut=cocciones.reduce((a,p)=>a+p.kg_out,0);
  const rendLimp=kgIn>0?(kgIn-kgDesp)/kgIn:null;
  const rendCoc=kgCocIn>0?kgCocOut/kgCocIn:null;
  return{rendLimp,rendCoc,kgIn,kgDesp,kgCocIn,kgCocOut};
}

function generarLoteId(proteina,fecha){
  const d=fecha?new Date(fecha+'T00:00:00'):new Date();
  const base=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const existentes=(DB.lotes||[]).filter(l=>l.lote_id.startsWith(base)&&l.proteina===proteina);
  return base+'-'+String.fromCharCode(65+existentes.length);
}

}

function calcVenc(fechaStr,meses){
  const d=new Date(fechaStr+'T00:00:00');
  d.setMonth(d.getMonth()+meses);
  return d.toISOString().slice(0,10);
}

function imprimirEtiquetaLote(loteId, subtitulo){
  const lote=(DB.lotes||[]).find(l=>l.lote_id===loteId);
  let proteina=loteId, fechaElab='—', vencH='—', vencF='—', kg='—';
  if(lote){
    proteina=lote.proteina;
    fechaElab=lote.fecha_elab==='Anterior al sistema de lotes'?'Stock previo':lote.fecha_elab;
    vencH=lote.venc_heladera||'—';
    vencF=lote.venc_freezer||'—';
    kg=fmt(lote.kg_inicial,2)+' kg';
  }
  const desc=subtitulo||proteina;
  const copias=parseInt(prompt('¿Cuántas etiquetas?','1'))||1;
  if(copias<=0)return;

  const {jsPDF}=window.jspdf;
  // 120mm ancho x 50mm alto, landscape no es necesario porque ya es más ancho que alto
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:[50,120]});

  for(let i=0;i<copias;i++){
    if(i>0)doc.addPage([50,120],'landscape');

    // Fondo blanco
    doc.setFillColor(255,255,255);
    doc.rect(0,0,120,50,'F');

    // Número de lote — grande y bold
    doc.setFont('helvetica','bold');
    doc.setFontSize(22);
    doc.setTextColor(0,0,0);
    doc.text(loteId,5,14);

    // Subtítulo (qué es)
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(40,40,40);
    doc.text(desc,5,21);

    // Proteína (si es distinta al subtítulo)
    if(desc!==proteina){
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.setTextColor(100,100,100);
      doc.text(proteina,5,26);
    }

    // Línea divisora
    doc.setDrawColor(180,180,180);
    doc.setLineWidth(0.3);
    doc.line(5,29,115,29);

    // Grid de datos — 2 columnas
    const col1x=5, col2x=63;
    let y=34;

    // Elaboración
    doc.setFont('helvetica','normal');
    doc.setFontSize(6);
    doc.setTextColor(120,120,120);
    doc.text('ELABORACIÓN',col1x,y);
    doc.text('CANTIDAD',col2x,y);
    y+=4;
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(0,0,0);
    doc.text(fechaElab,col1x,y);
    doc.text(kg,col2x,y);
    y+=5;

    // Vencimientos
    doc.setFont('helvetica','normal');
    doc.setFontSize(6);
    doc.setTextColor(120,120,120);
    doc.text('VENCE HELADERA',col1x,y);
    doc.text('VENCE FREEZER',col2x,y);
    y+=4;
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(90,45,0);
    doc.text(vencH,col1x,y);
    doc.setTextColor(0,60,40);
    doc.text(vencF,col2x,y);
  }

  // Descargar PDF directamente → se abre con Adobe que ya tiene el tamaño correcto
  const blob=doc.output('blob');
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='etiqueta-'+loteId+'.pdf';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

  let teoVal=null;
  if(p.tipo==='limpieza'&&teo)teoVal=100-teo.desp_limpieza_pct;
  if(p.tipo==='coccion'&&teo&&teo.coccion_pct)teoVal=teo.coccion_pct;
  const dev=teoVal!==null?rend-teoVal:null;
  const dc=dev===null?'bgray':Math.abs(dev)<3?'bok':Math.abs(dev)<8?'bwarn':'bdanger';
  const tl=p.tipo==='limpieza'?'binfo':p.tipo==='coccion'?'bpurple':p.tipo==='apertura'?'bwarn':'bteal';

      <div class="det-row"><span class="det-label">Fecha</span><span class="det-val">${fmtFecha(p.fecha)}</span></div>
      <div class="det-row"><span class="det-label">Responsable</span><span class="det-val">${p.responsable||'—'}</span></div>
      <div class="det-row"><span class="det-label">Registrado por</span><span class="det-val">${p.usuario||'—'}</span></div>
    </div>
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;margin-bottom:8px">Movimiento</div>
    <div style="margin-bottom:16px">
      <div class="det-row"><span class="det-label">Origen</span><span class="det-val">${p.origen||'—'}</span></div>
      <div class="det-row"><span class="det-label">Destino</span><span class="det-val">${p.destino||'—'}</span></div>
      ${distsHTML?`<div style="font-size:10px;color:#888;margin:4px 0 4px">Distribución del limpio:</div>${distsHTML}`:''}
      <div class="det-row"><span class="det-label">Entrada</span><span class="det-val">${fmt(p.kg_in,3)} kg</span></div>
      <div class="det-row"><span class="det-label">Salida</span><span class="det-val">${fmt(p.kg_out,3)} kg</span></div>
      ${p.tipo==='armado'?`<div class="det-row"><span class="det-label">Unidades</span><span class="det-val">${p.unidades||0} u.</span></div>`:''}
      <div class="det-row">
        <span class="det-label">${p.tipo==='limpieza'?'Desperdicio':p.tipo==='armado'?'Recorte':'Merma'}</span>
        <span class="det-val" style="color:#854f0b">${fmt(p.kg_in-p.kg_out,3)} kg</span>
      </div>
    </div>
    ${teoVal!==null?`
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;margin-bottom:8px">Rendimiento</div>
    <div style="margin-bottom:16px">
      <div class="det-row"><span class="det-label">Real</span><span class="det-val">${rend.toFixed(1)}%</span></div>
      <div class="det-row"><span class="det-label">Teórico</span><span class="det-val">${teoVal.toFixed(1)}%</span></div>
      <div class="det-row"><span class="det-label">Desvío</span><span class="det-val"><span class="badge ${dc}">${dev>=0?'+':''}${dev.toFixed(1)}%</span></span></div>
    </div>`:''}

    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;margin-bottom:8px">Lote</div>
    <div style="background:${lote.es_legacy?'#f0efe8':'#e6f1fb'};border-radius:8px;padding:12px;margin-bottom:8px">
      <div style="font-size:${lote.es_legacy?'13':'16'}px;font-weight:700;color:${lote.es_legacy?'#888':'#0c447c'};margin-bottom:8px">
        ${lote.es_legacy?'📦 Stock previo al sistema de lotes':lote.lote_id}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px">
        <div><div style="color:#888;margin-bottom:2px">Elaboración</div><strong>${lote.fecha_elab}</strong></div>

        <div><div style="color:#854f0b;margin-bottom:2px">Venc. heladera</div><strong>${lote.venc_heladera}</strong></div>
        <div><div style="color:#085041;margin-bottom:2px">Venc. freezer</div><strong>${lote.venc_freezer}</strong></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px;font-size:12px" onclick="imprimirEtiquetaLote('${lote.lote_id}','${p.tipo==='limpieza'?p.destino||p.proteina:p.tipo==='coccion'?p.destino||p.proteina:p.proteina}')">🖨️ Imprimir etiqueta</button>`}
    </div>`:`
    <div style="background:#f0efe8;border-radius:8px;padding:10px 12px;font-size:11px;color:#888">
      Sin lote asignado.

  `;
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('panel-lateral').classList.add('open');
}

}

function initLoginSelect(){
  const sel=document.getElementById('login-user');
  sel.innerHTML='<option value="">Seleccionar...</option>'+
    DB.users.map(u=>`<option value="${u.id}">${u.nombre}</option>`).join('');
}

function doLogin(){
  const uid=document.getElementById('login-user').value;
  const pass=document.getElementById('login-pass').value;
  if(!uid){document.getElementById('login-error').textContent='Seleccioná un usuario.';return;}
  const user=DB.users.find(u=>u.id===uid);
  if(!user||pass!==user.pass){document.getElementById('login-error').textContent='Contraseña incorrecta.';return;}
  sessionStorage.setItem('planta_uid', uid);
  activarSesion(user);
}

function activarSesion(user){
  CU=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  document.getElementById('user-label').textContent=user.nombre;
  document.getElementById('user-avatar').textContent=user.nombre.substring(0,2).toUpperCase();
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    const tab=btn.dataset.tab;
    if(tab==='admin') btn.style.display=user.role==='gerente'?'':'none';
    else if(tab==='empleados') btn.style.display=(user.role==='gerente'||checkPerm('empleados'))?'':'none';
    else if(tab==='finanzas') btn.style.display=(user.role==='gerente'||checkPerm('finanzas'))?'':'none';
    else if(tab==='proveedores') btn.style.display=(user.role==='gerente'||checkPerm('proveedores'))?'':'none';
    else btn.style.display=checkPerm(tab)?'':'none';
  });
  const firstTab=document.querySelector('#main-tabs .tab:not([style*="none"])');
  if(firstTab)firstTab.click();
  checkAlertas();
}

function doLogout(){
  CU=null;
  sessionStorage.removeItem('planta_uid');
  document.getElementById('main-screen').style.display='none';
  document.getElementById('login-screen').style.display='block';
  document.getElementById('login-pass').value='';
  document.getElementById('login-error').textContent='';
  initLoginSelect();
}

function showTab(t,el){
  if(!checkPerm(t)&&t!=='admin')return;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  if(el)el.classList.add('active');
  renderTab(t);
}

  ({resumen:renderResumen,ingreso:renderIngreso,proceso:renderProceso,

    empleados:renderEmpleados,finanzas:renderFinanzas,

}

// ALERTAS
// ============================================================
function checkAlertas(){
  const ac=document.getElementById('alerts-container');if(!ac)return;
  const alerts=[];
  DB.procesos.forEach(p=>{
    const teo=DB.teorico[p.proteina];if(!teo)return;
    if(p.tipo==='limpieza'&&p.kg_in>0){
      const r=p.kg_desperdicio/p.kg_in*100,t=teo.desp_limpieza_pct;
      if(Math.abs(r-t)>8)alerts.push(`Desvío desperdicio ${p.proteina} (${fmtFecha(p.fecha)}): real ${r.toFixed(1)}% vs teórico ${t}%`);
    }
    if(p.tipo==='coccion'&&p.kg_in>0&&teo.coccion_pct){
      const r=p.kg_out/p.kg_in*100,t=teo.coccion_pct;
      if(Math.abs(r-t)>8)alerts.push(`Desvío cocción ${p.proteina} (${fmtFecha(p.fecha)}): real ${r.toFixed(1)}% vs teórico ${t}%`);
    }
  });
  Object.values(DB.substocks).flat().forEach(s=>{
    const v=getSS(s.key);
    if(v<0)alerts.push(`⛔ Stock NEGATIVO: ${s.label} — ${fmtSS(s.key,v)}`);
    else if(v<2&&v>0)alerts.push(`Stock bajo: ${s.label} — ${fmtSS(s.key,v)}`);
  });
  Object.entries(DB.pt).forEach(([k,v])=>{
    const prod=DB.productos.find(p=>p.ptKey===k);
    if(prod?.ventaDirecta) return; // no mostrar alerta para ventaDirecta
    if(v<0)alerts.push(`⛔ PT NEGATIVO: ${k} — ${v} u.`);
    else if(v<=5&&v>0)alerts.push(`Stock bajo PT: ${k} — ${v} u.`);
  });
  ac.innerHTML=alerts.map(a=>`<div class="alert-row">${a}</div>`).join('');
}

function renderResumen(){
  const el=document.getElementById('resumen');
  const months=[...new Set([...DB.ingresos,...DB.procesos,...DB.ventas,...DB.calidad]
    .map(r=>r.fecha?r.fecha.slice(0,7):'').filter(Boolean))].sort().reverse();
  const selMes=document.getElementById('res-mes')?.value||'';
  const ff=r=>!selMes||(r.fecha&&r.fecha.startsWith(selMes));
  const ing=DB.ingresos.filter(ff);
  const proc=DB.procesos.filter(ff);
  const vents=DB.ventas.filter(ff);
  const cal=DB.calidad.filter(ff);
  const totalIn=ing.reduce((a,r)=>a+r.kg_bruto,0);
  const totalDesp=proc.filter(p=>p.tipo==='limpieza').reduce((a,p)=>a+p.kg_desperdicio,0);
  const totalMerma=proc.filter(p=>p.tipo==='coccion'||p.tipo==='apertura').reduce((a,p)=>a+(p.kg_in-p.kg_out),0);
  const totalVU=vents.reduce((a,v)=>a+v.unidades,0);
  // Rendimiento: promedio de rendimientos individuales (no global, para no depender del stock inicial)
  const limpiezas=proc.filter(p=>p.tipo==='limpieza'&&p.kg_in>0);
  const rendGlobal=limpiezas.length>0
    ? limpiezas.reduce((a,p)=>a+(p.kg_out/p.kg_in*100),0)/limpiezas.length
    : 0;
  const totalPT=Object.values(DB.pt).reduce((a,v)=>a+v,0);
  const totalCaidas=(DB.caidas||[]).filter(ff).reduce((a,r)=>a+r.cantidad,0);
  const totalPedidos=cal.reduce((a,r)=>a+r.pedidos,0);
  const totalErrPick=cal.reduce((a,r)=>a+r.errores,0);
  const totalDev=(DB.devoluciones||[]).filter(ff).reduce((a,r)=>a+r.cantidad,0);
  const totalConsumoInt=(DB.consumoInterno||[]).filter(ff).reduce((a,r)=>a+r.cantidad,0);
  const totalVendidasPer=vents.reduce((a,v)=>a+v.unidades,0);
  const totalBajas=totalVendidasPer+totalCaidas+totalDev;
  const pctError=totalPedidos>0?(totalErrPick/totalPedidos*100):0;
  const pctCaidas=totalBajas>0?(totalCaidas/totalBajas*100):0;
  const pctDev=totalBajas>0?(totalDev/totalBajas*100):0;

  // Stats por empleado
  const empStats={};
  DB.procesos.filter(ff).forEach(p=>{
    const emp=p.responsable; if(!emp) return;
    if(!empStats[emp]) empStats[emp]={limpieza:[],coccion:[]};
    const teo=DB.teorico[p.proteina];
    if(p.tipo==='limpieza'&&p.kg_in>0&&teo){
      const rReal=(p.kg_in-p.kg_desperdicio)/p.kg_in*100;
      empStats[emp].limpieza.push({proteina:p.proteina,rReal,rTeo:100-teo.desp_limpieza_pct,dev:rReal-(100-teo.desp_limpieza_pct)});
    }
    if(p.tipo==='coccion'&&p.kg_in>0&&teo?.coccion_pct){
      const rReal=p.kg_out/p.kg_in*100;
      empStats[emp].coccion.push({proteina:p.proteina,rReal,rTeo:teo.coccion_pct,dev:rReal-teo.coccion_pct});
    }
  });
  const empStatsHTML=Object.keys(empStats).length===0
    ?'<div style="color:#888;font-size:12px;padding:8px 0">Sin datos — asigná responsables en los procesos.</div>'
    :Object.entries(empStats).map(([emp,data])=>{
      const avgDevLimp=data.limpieza.length?data.limpieza.reduce((a,r)=>a+r.dev,0)/data.limpieza.length:null;
      const avgDevCoc=data.coccion.length?data.coccion.reduce((a,r)=>a+r.dev,0)/data.coccion.length:null;
      const dcL=avgDevLimp===null?'bgray':Math.abs(avgDevLimp)<3?'bok':Math.abs(avgDevLimp)<8?'bwarn':'bdanger';
      const dcC=avgDevCoc===null?'bgray':Math.abs(avgDevCoc)<3?'bok':Math.abs(avgDevCoc)<8?'bwarn':'bdanger';
      return `<tr>
        <td><strong>${emp}</strong></td>
        <td style="color:#888">${data.limpieza.length} proc.</td>
        <td>${avgDevLimp!==null?`<span class="badge ${dcL}">${avgDevLimp>=0?'+':''}${avgDevLimp.toFixed(1)}%</span>`:'<span class="badge bgray">—</span>'}</td>
        <td style="color:#888">${data.coccion.length} proc.</td>
        <td>${avgDevCoc!==null?`<span class="badge ${dcC}">${avgDevCoc>=0?'+':''}${avgDevCoc.toFixed(1)}%</span>`:'<span class="badge bgray">—</span>'}</td>
      </tr>`;
    }).join('');

  // Desvío kgMP real vs teórico por proteína
  const protDesvios=Object.keys(DB.substocks).map(prot=>{
    const teo=DB.teorico[prot];
    const r=calcKgMPReal(prot);
    const rendLimpTeo=teo?(100-teo.desp_limpieza_pct)/100:null;
    const rendCocTeo=teo?.coccion_pct?teo.coccion_pct/100:null;
    const rendLimpReal=r.rendLimp;
    const rendCocReal=r.rendCoc;
    const devLimp=rendLimpReal!==null&&rendLimpTeo?((rendLimpReal-rendLimpTeo)*100):null;
    const devCoc=rendCocReal!==null&&rendCocTeo?((rendCocReal-rendCocTeo)*100):null;
    return{prot,rendLimpTeo,rendLimpReal,devLimp,rendCocTeo,rendCocReal,devCoc};
  });

  el.innerHTML=`
  <div class="month-filter">
    <label style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em">Filtrar por mes</label>
    <select style="width:auto;min-width:140px" onchange="renderResumen()" id="res-mes">
      <option value="">Todos los períodos</option>
      ${months.map(m=>`<option value="${m}"${m===selMes?' selected':''}>${m}</option>`).join('')}
    </select>
  </div>

  <div style="font-size:12px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Producción</div>
  <div class="kgrid">
    <div class="kcard ${rendGlobal>=70?'ok':rendGlobal>=55?'warn':'danger'}">
      <div class="klabel">Rendimiento limpieza</div><div class="kval">${rendGlobal.toFixed(1)}%</div>
      <div class="ksub">promedio de ${limpiezas.length} proceso${limpiezas.length!==1?'s':''}</div>
    </div>
    <div class="kcard"><div class="klabel">Kg bruto ingresado</div><div class="kval">${fmt(totalIn,1)}</div><div class="ksub">registrado en ingresos</div></div>
    <div class="kcard ${totalDesp>0?'danger':''}"><div class="klabel">Desperdicio total</div><div class="kval">${fmt(totalDesp,1)} kg</div><div class="ksub">en procesos de limpieza</div></div>
    <div class="kcard warn"><div class="klabel">Merma cocción</div><div class="kval">${fmt(totalMerma,1)} kg</div><div class="ksub">en proceso</div></div>
    <div class="kcard ok"><div class="klabel">Stock terminado</div><div class="kval">${totalPT}</div><div class="ksub">unidades</div></div>
    <div class="kcard"><div class="klabel">Unidades vendidas</div><div class="kval">${totalVU}</div><div class="ksub">período</div></div>
  </div>

  <div style="font-size:12px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;margin-top:.5rem">Calidad</div>
  <div class="kgrid" style="margin-bottom:1.5rem">
    <div class="kcard ${pctError<=2?'ok':pctError<=5?'warn':'danger'}">
      <div class="klabel">% error picking</div><div class="kval">${pctError.toFixed(1)}%</div><div class="ksub">${totalErrPick} err / ${totalPedidos} ped</div>
    </div>
    <div class="kcard ${pctCaidas<=1?'ok':pctCaidas<=3?'warn':'danger'}">
      <div class="klabel">% caídas por venc.</div><div class="kval">${pctCaidas.toFixed(1)}%</div><div class="ksub">${totalCaidas} / ${totalBajas} unidades</div>
    </div>
    <div class="kcard ${pctDev<=1?'ok':pctDev<=3?'warn':'danger'}">
      <div class="klabel">% devoluciones</div><div class="kval">${pctDev.toFixed(1)}%</div><div class="ksub">${totalDev} / ${totalBajas} unidades</div>
    </div>
    <div class="kcard">
      <div class="klabel">Consumo interno</div><div class="kval">${totalConsumoInt}</div><div class="ksub">unidades período</div>
    </div>
  </div>

  <div class="card">

function buildRendimientosHTML(protDesvios,proc,ff){
  return protDesvios.map(function(item){
    var prot=item.prot,rendLimpTeo=item.rendLimpTeo,rendLimpReal=item.rendLimpReal,devLimp=item.devLimp,rendCocTeo=item.rendCocTeo,rendCocReal=item.rendCocReal,devCoc=item.devCoc;
    var kgComprado=DB.ingresos.filter(function(r){return r.proteina===prot&&ff(r);}).reduce(function(a,r){return a+r.kg_bruto;},0);
    var procsLimp=proc.filter(function(p){return p.proteina===prot&&p.tipo==='limpieza';});
    var procsCoc=proc.filter(function(p){return p.proteina===prot&&(p.tipo==='coccion'||p.tipo==='apertura');});
    var kgDesp=procsLimp.reduce(function(a,p){return a+p.kg_desperdicio;},0);
    var kgLimpio=procsLimp.reduce(function(a,p){return a+p.kg_out;},0);
    var kgMerma=procsCoc.reduce(function(a,p){return a+(p.kg_in-p.kg_out);},0);
    var kgCocido=procsCoc.reduce(function(a,p){return a+p.kg_out;},0);
    var dcL=devLimp!==null?(Math.abs(devLimp)<3?'bok':Math.abs(devLimp)<8?'bwarn':'bdanger'):'bgray';
    var dcC=devCoc!==null?(Math.abs(devCoc)<3?'bok':Math.abs(devCoc)<8?'bwarn':'bdanger'):'bgray';
    var barColorL=devLimp!==null&&Math.abs(devLimp)<3?'#1D9E75':devLimp!==null&&Math.abs(devLimp)<8?'#EF9F27':'#E24B4A';
    var barColorC=devCoc!==null&&Math.abs(devCoc)<3?'#1D9E75':devCoc!==null&&Math.abs(devCoc)<8?'#EF9F27':'#E24B4A';
    var h='<div style="padding:10px 0;border-bottom:1px solid #f0efe8">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    h+='<div style="font-size:13px;font-weight:500">'+prot+'</div><div style="display:flex;gap:6px">';
    if(rendLimpReal!==null) h+='<span class="badge '+dcL+'">Limp: '+(devLimp!==null?(devLimp>=0?'+':'')+devLimp.toFixed(1)+'%':'—')+'</span>';
    if(rendCocReal!==null) h+='<span class="badge '+dcC+'">Coc: '+(devCoc!==null?(devCoc>=0?'+':'')+devCoc.toFixed(1)+'%':'—')+'</span>';
    h+='</div></div>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:8px">';
    if(kgComprado>0) h+='<div style="padding:6px 8px;background:#f0efe8;border-radius:6px;font-size:11px"><div style="color:#888;margin-bottom:2px">Comprado</div><strong>'+fmt(kgComprado,2)+' kg</strong></div>';
    if(kgDesp>0) h+='<div style="padding:6px 8px;background:#fcebeb;border-radius:6px;font-size:11px"><div style="color:#791f1f;margin-bottom:2px">Desperdicio</div><strong style="color:#791f1f">'+fmt(kgDesp,2)+' kg</strong></div>';
    if(kgLimpio>0) h+='<div style="padding:6px 8px;background:#e6f1fb;border-radius:6px;font-size:11px"><div style="color:#0c447c;margin-bottom:2px">Limpio</div><strong style="color:#0c447c">'+fmt(kgLimpio,2)+' kg</strong></div>';
    if(kgMerma>0) h+='<div style="padding:6px 8px;background:#faeeda;border-radius:6px;font-size:11px"><div style="color:#633806;margin-bottom:2px">Merma cocción</div><strong style="color:#633806">'+fmt(kgMerma,2)+' kg</strong></div>';
    if(kgCocido>0) h+='<div style="padding:6px 8px;background:#e1f5ee;border-radius:6px;font-size:11px"><div style="color:#085041;margin-bottom:2px">Cocido</div><strong style="color:#085041">'+fmt(kgCocido,2)+' kg</strong></div>';
    h+='</div><div style="display:flex;gap:12px;flex-wrap:wrap">';
    h+='<div style="flex:1;min-width:160px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:3px">Limpieza — Teórico '+(rendLimpTeo?((rendLimpTeo)*100).toFixed(1):'—')+'%'+(rendLimpReal!==null?' | Real '+(rendLimpReal*100).toFixed(1)+'%':'')+'</div>';
    h+=rendLimpReal!==null?'<div class="bar-wrap"><div class="bar" style="width:'+Math.min((rendLimpReal*100),100)+'%;background:'+barColorL+'"></div></div>':'<div style="font-size:11px;color:#ccc">Sin procesos</div>';
    h+='</div>';
    if(rendCocTeo){
      h+='<div style="flex:1;min-width:160px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:3px">Cocción — Teórico '+(rendCocTeo*100).toFixed(1)+'%'+(rendCocReal!==null?' | Real '+(rendCocReal*100).toFixed(1)+'%':'')+'</div>';
      h+=rendCocReal!==null?'<div class="bar-wrap"><div class="bar" style="width:'+Math.min((rendCocReal*100),100)+'%;background:'+barColorC+'"></div></div>':'<div style="font-size:11px;color:#ccc">Sin procesos</div>';
      h+='</div>';
    }
    h+='</div></div>';
    return h;
  }).join('');
}

function addCalidad(){
  const fecha=document.getElementById('q-fecha').value;
  if(!fecha){alert('Ingresá la fecha.');return;}
  DB.calidad.push({fecha,
    caidas:0, // ya no se usa acá
    pedidos:parseInt(document.getElementById('q-pedidos').value)||0,
    errores:parseInt(document.getElementById('q-errores').value)||0,
    devoluciones:0, // ya no se usa acá
    notas:document.getElementById('q-notas').value,
    usuario:CU.nombre,id:Date.now()});

  ['q-pedidos','q-errores','q-notas'].forEach(id=>document.getElementById(id).value='');
  renderCalidad();

function addCaida(){
  const fecha=document.getElementById('caida-fecha').value;
  const ptKey=document.getElementById('caida-prod').value;
  const cant=parseInt(document.getElementById('caida-cant').value)||0;
  const notas=document.getElementById('caida-notas').value;
  if(!fecha||cant<=0){alert('Completá fecha y cantidad.');return;}
  const prod=DB.productos.find(p=>p.ptKey===ptKey);
  if(getPT(ptKey)<cant){if(!confirm(`Stock insuficiente: ${getPT(ptKey)} u. ¿Continuás?`))return;}
  setPT(ptKey,Math.max(0,getPT(ptKey)-cant));
  if(!DB.caidas) DB.caidas=[];
  DB.caidas.push({fecha,producto:prod?.nombre||ptKey,ptKey,cantidad:cant,notas,usuario:CU.nombre,id:Date.now()});
  saveDB();
  document.getElementById('caida-cant').value='';
  document.getElementById('caida-notas').value='';
  renderCalidad();
  showCalidadTab('caidas',null);
  document.querySelectorAll('#calidad .mtab')[1].classList.add('active');
}

function delCaida(i){
  if(CU.role!=='gerente') return;
  const r=(DB.caidas||[])[i];
  if(r) setPT(r.ptKey, getPT(r.ptKey)+r.cantidad);
  DB.caidas.splice(i,1); saveDB(); renderCalidad();
  showCalidadTab('caidas',null);
  document.querySelectorAll('#calidad .mtab')[1].classList.add('active');

function actualizarLotePreview(){
  const fecha=document.getElementById('i-fecha')?.value;
  const prot=document.getElementById('i-prot')?.value;
  const loteInput=document.getElementById('i-lote');
  const prev=document.getElementById('i-lote-prev');
  if(!fecha||!prot||!loteInput)return;
  const sugerido=generarLoteId(prot,fecha);
  if(!loteInput.value)loteInput.value=sugerido;
  if(prev)prev.textContent='Sugerido: '+sugerido;
}

function addIngreso(){
  const fecha=document.getElementById('i-fecha').value;
  const proteina=document.getElementById('i-prot').value;
  const kg=parseFloat(document.getElementById('i-kg').value);
  const costo=parseFloat(document.getElementById('i-costo').value)||0;
  const prov=document.getElementById('i-prov').value;
  const loteId=document.getElementById('i-lote')?.value.trim()||generarLoteId(proteina,fecha);
  if(!fecha||isNaN(kg)||kg<=0){alert('Completá fecha, proteína y kg bruto.');return;}
  DB.ingresos.push({fecha,proteina,kg_bruto:kg,costo_kg:costo,proveedor:prov,usuario:CU.nombre,lote_id:loteId,id:Date.now()});
  const mpSS=DB.substocks[proteina]?.find(s=>s.estado==='mp');
  if(mpSS)setSS(mpSS.key,getSS(mpSS.key)+kg);
  registrarLote(loteId,proteina,fecha,kg,mpSS?.key||'');
  saveDB();
  document.getElementById('i-kg').value='';
  document.getElementById('i-costo').value='';
  document.getElementById('i-prov').value='';
  document.getElementById('i-lote').value='';
  renderIngreso();
}

function delIngreso(i){
  if(CU.role!=='gerente')return;
  const r=DB.ingresos[i];
  const mpSS=DB.substocks[r.proteina]?.find(s=>s.estado==='mp');
  if(mpSS)setSS(mpSS.key,Math.max(0,getSS(mpSS.key)-r.kg_bruto));
  DB.ingresos.splice(i,1);saveDB();renderIngreso();
}

function buildProcesoRows(lista, conProtCol=true){
  if(!lista||lista.length===0) return '';
  return lista.map(p=>{
    const idx=DB.procesos.findIndex(pr=>pr.id===p.id);
    const teo=DB.teorico[p.proteina];
    const rend=p.kg_in>0?(p.kg_out/p.kg_in*100):0;
    let teoVal=null;
    if(p.tipo==='limpieza'&&teo)teoVal=100-teo.desp_limpieza_pct;
    if(p.tipo==='coccion'&&teo&&teo.coccion_pct)teoVal=teo.coccion_pct;
    const dev=teoVal?rend-teoVal:null;
    const dc=dev===null?'bgray':Math.abs(dev)<3?'bok':Math.abs(dev)<8?'bwarn':'bdanger';
    const tl=p.tipo==='limpieza'?'binfo':p.tipo==='coccion'?'bpurple':p.tipo==='apertura'?'bwarn':'bteal';
    const loteBadge=p.lote_id?`<span class="badge binfo">${p.lote_id}</span>`:'';
    return `<tr class="proc-row" onclick="abrirPanel(${idx})">
      <td>${fmtFecha(p.fecha)}</td>
      ${conProtCol?`<td>${p.proteina}</td>`:''}
      <td><span class="badge ${tl}">${p.tipo}</span></td>
      <td>${fmt(p.kg_in,2)} → ${fmt(p.kg_out,2)} kg</td>
      <td>${p.tipo==='armado'?(p.unidades||0)+' u.':rend.toFixed(1)+'%'}</td>
      <td><span class="badge ${dc}">${dev!==null?(dev>=0?'+':'')+dev.toFixed(1)+'%':'—'}</span></td>
      <td>${loteBadge}</td>
      <td onclick="event.stopPropagation()">${CU.role==='gerente'&&idx>=0?`<button class="btn-sm" onclick="delProceso(${idx})">x</button>`:''}</td>
    </tr>`;
  }).join('');
}

}

    // Auto-seleccionar sub-stock del primer producto y filtrar productos

  } else if(activeModo==='despacho_emp'){
    const fechaHoy=today();
    const fechaRef=document.getElementById('pf-fecha-desp')?.value||fechaHoy;

    frm.innerHTML='<div class="card">'
      +'<div class="ctitle">Registrar baja real — Despacho empresas</div>'

      +teoricoHTML

}

function calcLimpieza(){
  const ki=parseFloat(document.getElementById('pf-kgin')?.value)||0;
  const kd=parseFloat(document.getElementById('pf-desp')?.value)||0;
  const subs=DB.substocks[activeProt]?.filter(s=>s.estado==='crudo'||s.estado==='lpu')||[];
  const td=subs.reduce((a,s)=>{const el=document.getElementById('pf-'+s.key);return a+(parseFloat(el?.value)||0);},0);
  const resto=ki-kd-td;
  const prev=document.getElementById('pf-prev');if(!prev)return;
  prev.innerHTML=`Rendimiento: <strong>${ki>0?((ki-kd)/ki*100).toFixed(1):'-'}%</strong> | Distribuido: <strong>${fmt(td,2)}</strong> | Diferencia: <strong style="color:${Math.abs(resto)<0.1?'#0f6e56':'#e24b4a'}">${fmt(resto,2)} kg</strong>`;
}

function calcCoccion(){
  const ki=parseFloat(document.getElementById('pf-kgin')?.value)||0;
  const ko=parseFloat(document.getElementById('pf-kgout')?.value)||0;
  const prev=document.getElementById('pf-prev');if(!prev)return;
  const teo=DB.teorico[activeProt];
  prev.innerHTML=`Rendimiento: <strong>${ki>0?(ko/ki*100).toFixed(1):'-'}%</strong>${teo?.coccion_pct?` | Teórico: <strong>${teo.coccion_pct}%</strong>`:''} | Merma: <strong>${fmt(ki-ko,2)} kg</strong>`;
}

// Sub-stocks que solo pueden generar ciertos productos (restricciones)
// Si un sub-stock no está aquí, permite todos los productos de la proteína
const SS_RESTRICCIONES = {
  // Pechuga LPU abierta: solo medallones de pechuga y wraps/ensaladas
  'pechuga_lpu_cocido_abierto': ss=>
    ss.substock==='pechuga_lpu_cocido_abierto',
  // Recortes pechuga abiertos: curry, teriyaki, tiras, tarta (no medallones enteros)
  'pechuga_recortes_cocido_abierto': ss=>
    ss.substock==='pechuga_recortes_cocido_abierto',
  // Recortes tapa abiertos: solo goulash, pulled, wraps (no ternera entera)
  'tapa_recortes_cocido_abierto': ss=>
    ss.substock==='tapa_recortes_cocido_abierto',
  // Brisket tapa abierto: solo ternera braseada
  'tapa_brisket_cocido_abierto': ss=>
    ss.substock==='tapa_brisket_cocido_abierto',
};

function filtrarProductosPorOrigen(){
  const origenSel = document.getElementById('pf-origen');
  const dl = document.getElementById('pf-producto-list');
  const input = document.getElementById('pf-producto');
  if(!origenSel||!dl) return;

  const origenKey = origenSel.value;
  const restriccion = SS_RESTRICCIONES[origenKey];

  // Obtener todos los productos de la proteína activa
  const prodsProt = DB.productos.filter(p=>p.proteina===activeProt);
  const filtrados = restriccion ? prodsProt.filter(restriccion) : prodsProt;

  // Rebuildar el datalist
  dl.innerHTML = filtrados.map(p=>`<option value="${p.ptKey}">${p.nombre} — ${fmt(p.kgPorcion,3)} kg porción</option>`).join('');

  // Si el producto seleccionado ya no es válido, limpiarlo
  if(input && input.value){
    const valido = filtrados.some(p=>p.ptKey===input.value||p.nombre===input.value);
    if(!valido){ input.value=''; input.dataset.value=''; }
  }
}

function buildOrigenArmado(subs, prodsProt){
  // Muestra TODOS los sub-stocks cocidos/abiertos de la proteína,
  // incluyendo type='u' (medallones, etc.).
  // Priorizando: abiertos → cocidos → resto.
  const abiertos = subs.filter(s=>s.estado==='abierto');
  const cocidos  = subs.filter(s=>s.estado==='cocido');
  const otros    = subs.filter(s=>s.estado!=='abierto' && s.estado!=='cocido' && s.estado!=='mp' && s.estado!=='lpu');
  const ordered  = [...abiertos, ...cocidos, ...otros];
  return ordered.map(s=>`<option value="${s.key}">${s.label} — ${fmtSS(s.key,getSS(s.key))}</option>`).join('');
}

function updateArmadoSalidaLabel(){
  // Actualizar label de origen (kg vs unidades) según sub-stock seleccionado
  const origenSel=document.getElementById('pf-origen');
  const origenKey=origenSel?.value;
  const ssDef=origenKey?findSSdef(origenKey):null;
  const kginLabel=document.getElementById('pf-kgin-label');
  if(kginLabel){
    kginLabel.textContent=ssDef?.type==='u'?'Unidades de sub-stock usadas':'Kg de sub-stock usado';
  }
  const kginInput=document.getElementById('pf-kgin');
  if(kginInput&&ssDef){
    kginInput.step=ssDef.type==='u'?'1':'0.01';
    kginInput.placeholder=ssDef.type==='u'?'0':'0.00';
  }
}

function onProductoArmadoChange(){
  const sel=document.getElementById('pf-producto');
  if(!sel) return;
  // Funciona tanto para select como para datalist input
  const ptKey = sel.tagName==='SELECT' ? sel.value : sel.value;
  const prod = DB.productos.find(p=>p.ptKey===ptKey||p.nombre===ptKey);
  const substock = prod?.substock;
  if(substock){
    const origenSel=document.getElementById('pf-origen');
    if(origenSel){
      // Primero intentar seleccionar el _abierto del sub-stock del producto si tiene stock
      const abiertoKey=substock+'_abierto';
      let found=false;
      for(let i=0;i<origenSel.options.length;i++){
        if(origenSel.options[i].value===abiertoKey){
          const ssVal=getSS(abiertoKey);
          if(ssVal>0){origenSel.selectedIndex=i;found=true;break;}
        }
      }
      // Si no hay stock en _abierto, seleccionar el sub-stock directo
      if(!found){
        for(let i=0;i<origenSel.options.length;i++){
          if(origenSel.options[i].value===substock){
            origenSel.selectedIndex=i;
            break;
          }
        }
      }
    }
  }
  // Actualizar label y step del campo kgin según tipo del sub-stock origen seleccionado
  const origenSel=document.getElementById('pf-origen');
  const origenKey=origenSel?.value;
  const ssDef=origenKey?findSSdef(origenKey):null;
  const kginLabel=document.getElementById('pf-kgin-label');
  if(kginLabel){
    kginLabel.textContent=ssDef?.type==='u'?'Unidades de sub-stock usadas':'Kg de sub-stock usado';
  }
  const kginInput=document.getElementById('pf-kgin');
  if(kginInput&&ssDef){
    kginInput.step=ssDef.type==='u'?'1':'0.01';
    kginInput.placeholder=ssDef.type==='u'?'0':'0.00';
  }
  calcArmado();
}

function calcApertura(){
  const ki=parseFloat(document.getElementById('pf-kgin')?.value)||0;
  const ko=parseFloat(document.getElementById('pf-kgout')?.value)||0;
  const prev=document.getElementById('pf-prev');if(!prev)return;
  const merma=ki-ko;
  const pct=ki>0?(merma/ki*100):0;
  const teo=DB.teorico[activeProt];
  const teoPct=teo?.coccion_pct?(100-teo.coccion_pct):null;
  prev.innerHTML=`Merma real: <strong style="color:${merma<0?'#a32d2d':'#1a1a1a'}">${fmt(merma,3)} kg</strong> (${pct.toFixed(1)}%)${teoPct?` | Merma teórica: <strong>${teoPct.toFixed(1)}%</strong>`:''}
  | Stock después: <strong>${fmt(getSS(document.getElementById('pf-origen')?.value||'')-ki+ko,2)} kg</strong>`;
}

function addProcesoApertura(){
  const fecha=document.getElementById('pf-fecha').value;
  const origen=document.getElementById('pf-origen').value;
  const kgin=parseFloat(document.getElementById('pf-kgin').value);
  const kgout=parseFloat(document.getElementById('pf-kgout').value);
  const resp=document.getElementById('pf-resp')?.value||'';
  if(!fecha||isNaN(kgin)||isNaN(kgout)||kgin<=0){alert('Completá todos los campos.');return;}
  if(kgout>kgin){showProcesoError('Los kg de salida no pueden ser mayores a los kg que entraron.');return;}
  if(!checkStock(origen, kgin, 'kg')) return;
  const ssO=findSSdef(origen);
  const merma=kgin-kgout;
  const ssAbierto=origen+'_abierto';
  // Descuenta kgin del sub-stock cerrado, los kg netos van al sub-stock _abierto
  setSS(origen, getSS(origen)-kgin);
  setSS(ssAbierto, getSS(ssAbierto)+kgout);
  const loteId=document.getElementById('pf-lote')?.value||'';
  DB.procesos.push({fecha,proteina:activeProt,tipo:'apertura',kg_in:kgin,kg_out:kgout,kg_desperdicio:merma,
    origen:ssO?.label||'',destino:(ssO?.label||origen)+' (abierto)',substock_origen:origen,substock_destino:ssAbierto,
    responsable:resp,usuario:CU.nombre,lote_id:loteId,id:Date.now()});
  saveDB();renderProceso();checkAlertas();
}

function calcArmado(){
  const ki=parseFloat(document.getElementById('pf-kgin')?.value)||0;
  const uni=parseFloat(document.getElementById('pf-unidades')?.value)||0;
  const sel=document.getElementById('pf-producto');if(!sel)return;
  const prod=DB.productos.find(p=>p.ptKey===sel.value||p.nombre===sel.value);
  // Actualizar label si es modoKg (Peceto)
  const uniLabel=document.getElementById('pf-unidades-label');
  if(uniLabel) uniLabel.textContent=prod?.modoKg?'Kg producto final':'Unidades a generar';
  const prev=document.getElementById('pf-prev');if(!prev||!prod||!ki||!uni)return;
  const ku=(prod.kgPorcion*uni).toFixed(3);
  const rec=Math.max(0,ki-parseFloat(ku)).toFixed(3);
  const kgMPTeo=calcKgMPTeorico(prod);
  const kgMPReal=ki/uni;
  const devMP=((kgMPReal-kgMPTeo)/kgMPTeo*100);
  prev.innerHTML=`Kg cocido teórico para ${uni} u.: <strong>${ku} kg</strong> | Recorte est.: <strong>${rec} kg</strong> | kg MP/u real: <strong>${fmt(kgMPReal,3)}</strong> vs teo: <strong>${fmt(kgMPTeo,3)}</strong> <span class="badge ${Math.abs(devMP)<5?'bok':Math.abs(devMP)<15?'bwarn':'bdanger'}">${devMP>=0?'+':''}${devMP.toFixed(1)}%</span>`;
  document.getElementById('pf-recorte').value=rec;
}


function renderHistBajasM2(){
  const bajas = (DB.procesos||[]).filter(p=>p.tipo==='baja_empresa').slice().reverse();
  if(bajas.length===0) return '<p style="color:#888;font-size:12px;text-align:center;padding:.5rem">Sin bajas registradas</p>';
  
  // Agrupar por fecha
  const porFecha = {};
  bajas.forEach(b=>{
    if(!porFecha[b.fecha]) porFecha[b.fecha]=[];
    porFecha[b.fecha].push(b);
  });
  
  return Object.entries(porFecha).sort((a,b)=>b[0].localeCompare(a[0])).map(([fecha,bs])=>{
    // Calcular teórico del día
    const despachosDelDia = (DB.despachosM2||[]).filter(d=>d.fecha===fecha);
    const teoricoPorSS = {};
    despachosDelDia.forEach(d=>{
      d.items.forEach(it=>{
        if(!teoricoPorSS[it.substock]) teoricoPorSS[it.substock]=0;
        teoricoPorSS[it.substock] += it.kgTeorico||0;
      });
    });
    
    return `<div style="margin-bottom:10px">
      <div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">${fecha}</div>
      <table style="width:100%;font-size:12px">
        <thead><tr><th>Sub-stock</th><th>Kg reales</th><th>Kg teórico</th><th>Desvío</th><th>Nota</th><th></th></tr></thead>
        <tbody>${bs.map((b,i)=>{
          const ssDef = findSSdef(b.substock_origen);
          const teo = teoricoPorSS[b.substock_origen]||null;
          const diff = teo!==null?b.kg_in-teo:null;
          const dc = diff===null?'bgray':Math.abs(diff)<0.2?'bok':Math.abs(diff)<0.5?'bwarn':'bdanger';
          const idx = DB.procesos.findIndex(p=>p.id===b.id);
          return `<tr>
            <td>${ssDef?ssDef.label:b.substock_origen}</td>
            <td style="font-weight:600">${fmt(b.kg_in,3)} kg</td>
            <td style="color:#888">${teo!==null?fmt(teo,3)+' kg':'—'}</td>
            <td><span class="badge ${dc}">${diff!==null?(diff>=0?'+':'')+fmt(diff,3)+' kg':'—'}</span></td>
            <td style="color:#888;font-size:11px">${b.nota||'—'}</td>
            <td>${CU.role==='gerente'?`<button class="btn-sm" onclick="delProceso(${idx})">x</button>`:''}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  }).join('');
}

function addBajaEmpresa(){
  const fecha = document.getElementById('pf-fecha-desp')?.value||today();
  const ss = document.getElementById('pf-ss-baja')?.value;
  const kg = parseFloat(document.getElementById('pf-kg-baja')?.value);

function addProcesoLimpieza(){
  const fecha=document.getElementById('pf-fecha').value;
  const kgin=parseFloat(document.getElementById('pf-kgin').value);
  const kdesp=parseFloat(document.getElementById('pf-desp').value)||0;
  const resp=document.getElementById('pf-resp')?.value||'';
  const loteId=document.getElementById('pf-lote')?.value||'';
  if(!fecha||isNaN(kgin)||kgin<=0){alert('Completá fecha y kg entrada.');return;}
  const subs=DB.substocks[activeProt]?.filter(s=>s.estado==='crudo'||s.estado==='lpu')||[];
  const dists={};
  subs.forEach(s=>{const el=document.getElementById('pf-'+s.key);dists[s.key]=parseFloat(el?.value)||0;});
  const mpSS=DB.substocks[activeProt]?.find(s=>s.estado==='mp');
  // Validar que haya suficiente MP
  if(mpSS && !checkStock(mpSS.key, kgin, 'kg')) return;
  // Validar que la suma distribuida no supere kg entrada - desperdicio
  const totalDist = Object.values(dists).reduce((a,b)=>a+b,0);
  const kgNeto = kgin - kdesp;
  if(totalDist > kgNeto + 0.001){
    showProcesoError(`La suma distribuida (${fmt(totalDist,3)} kg) supera los kg netos disponibles (${fmt(kgNeto,3)} kg).`);
    return;
  }
  if(mpSS)setSS(mpSS.key,getSS(mpSS.key)-kgin);
  subs.forEach(s=>setSS(s.key,getSS(s.key)+(dists[s.key]||0)));
  const rec={fecha,proteina:activeProt,tipo:'limpieza',kg_in:kgin,kg_out:kgin-kdesp,kg_desperdicio:kdesp,
    dists,origen:'MP entera',destino:subs.map(s=>s.label).join(' / '),responsable:resp,usuario:CU.nombre,id:Date.now()};
  if(loteId)rec.lote_id=loteId;
  DB.procesos.push(rec);
  saveDB();renderProceso();checkAlertas();
}

function showProcesoError(msg){
  // Muestra error en el formulario de proceso sin usar alert()
  let errDiv = document.getElementById('pf-error');
  if(!errDiv){
    errDiv = document.createElement('div');
    errDiv.id = 'pf-error';
    errDiv.style.cssText = 'background:#fee2e2;color:#a32d2d;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:500;margin-bottom:10px';
    const btn = document.querySelector('[onclick*="addProceso"], [onclick*="addBaja"]');
    const frm = document.getElementById('proceso-form') || document.querySelector('.card');
    if(frm) frm.insertBefore(errDiv, frm.firstChild);
  }
  errDiv.textContent = '⚠ ' + msg;
  errDiv.style.display = 'block';
  setTimeout(()=>{ if(errDiv) errDiv.style.display='none'; }, 5000);
}

function checkStock(ssKey, cantidad, label){
  // Retorna true si hay suficiente stock, false y muestra error si no
  const disponible = getSS(ssKey);
  if(cantidad > disponible){
    showProcesoError(`Stock insuficiente: querés usar ${fmt(cantidad,3)} ${label||'kg'} pero solo hay ${fmt(disponible,3)} ${label||'kg'} disponibles en ese sub-stock.`);
    return false;
  }
  return true;
}

function addProcesoCoccion(){
  const fecha=document.getElementById('pf-fecha').value;
  const origen=document.getElementById('pf-origen').value;
  const destino=document.getElementById('pf-destino').value;
  const kgin=parseFloat(document.getElementById('pf-kgin').value);
  const kgout=parseFloat(document.getElementById('pf-kgout').value);
  const resp=document.getElementById('pf-resp')?.value||'';
  const loteId=document.getElementById('pf-lote')?.value||'';
  if(!fecha||isNaN(kgin)||isNaN(kgout)||kgin<=0){alert('Completá todos los campos.');return;}
  const ssO=findSSdef(origen);const ssD=findSSdef(destino);
  const unidadCoccion = ssO?.type==='u'?'u.':'kg';
  if(!checkStock(origen, kgin, unidadCoccion)) return;
  setSS(origen,getSS(origen)-kgin);
  setSS(destino,getSS(destino)+kgout);
  const rec={fecha,proteina:activeProt,tipo:'coccion',kg_in:kgin,kg_out:kgout,kg_desperdicio:kgin-kgout,
    origen:ssO?.label||'',destino:ssD?.label||'',substock_origen:origen,substock_destino:destino,
    responsable:resp,usuario:CU.nombre,id:Date.now()};
  if(loteId)rec.lote_id=loteId;
  DB.procesos.push(rec);
  saveDB();renderProceso();checkAlertas();
}

function addProcesoArmado(){
  const fecha=document.getElementById('pf-fecha').value;
  const origen=document.getElementById('pf-origen').value;
  const _prodInput=document.getElementById('pf-producto');
  const _prodFound=DB.productos.find(p=>p.ptKey===_prodInput?.value||p.nombre===_prodInput?.value);
  const ptKey=_prodFound?.ptKey||_prodInput?.value;
  const kgin=parseFloat(document.getElementById('pf-kgin').value);
  const unidades=parseInt(document.getElementById('pf-unidades').value);
  const recorte=parseFloat(document.getElementById('pf-recorte').value)||0;
  const resp=document.getElementById('pf-resp')?.value||'';
  const loteId=document.getElementById('pf-lote')?.value||'';
  if(!fecha||isNaN(kgin)||isNaN(unidades)||kgin<=0||unidades<=0){alert('Completá todos los campos.');return;}
  const ssO=findSSdef(origen);
  const unidadArmado = ssO?.type==='u'?'u.':'kg';
  if(!checkStock(origen, kgin, unidadArmado)) return;

async function delProceso(i){
  if(CU.role!=='gerente'){alert('Solo el gerente puede eliminar.');return;}
  const p=DB.procesos[i];
  if(p.tipo==='limpieza'){
    const mpSS=DB.substocks[p.proteina]?.find(s=>s.estado==='mp');
    if(mpSS)setSS(mpSS.key,getSS(mpSS.key)+p.kg_in);
    if(p.dists)Object.entries(p.dists).forEach(([k,v])=>setSS(k,Math.max(0,getSS(k)-v)));
  }
  if(p.tipo==='coccion'){
    setSS(p.substock_origen,getSS(p.substock_origen)+p.kg_in);
    setSS(p.substock_destino,Math.max(0,getSS(p.substock_destino)-p.kg_out));
  }
  if(p.tipo==='apertura'){
    // Revierte: devuelve kg_in al origen y saca kg_out del _abierto
    setSS(p.substock_origen, getSS(p.substock_origen)+p.kg_in);
    const ssAbierto=p.substock_destino||p.substock_origen+'_abierto';
    setSS(ssAbierto, Math.max(0,getSS(ssAbierto)-p.kg_out));
  }
  if(p.tipo==='armado'){
    setSS(p.substock_origen,getSS(p.substock_origen)+p.kg_in);
    setPT(p.destino,Math.max(0,getPT(p.destino)-p.unidades));
  }
  if(p.tipo==='baja_empresa'){
    // Revertir: devolver kg al sub-stock
    setSS(p.substock_origen, getSS(p.substock_origen)+p.kg_in);
  }
  // Marcar el ID como borrado para que el merge no lo restaure desde Supabase
  if(p.id) _deletedIds.add(String(p.id));
  DB.procesos.splice(i,1);
  await saveDB();renderProceso();checkAlertas();
}

function renderVentaDirectaStock(prodsProt){
  const vd = prodsProt.filter(p=>p.ventaDirecta);
  if(!vd.length) return '';
  // Agrupar por sub-stock compartido
  const grupos = {};
  vd.forEach(p=>{
    if(!grupos[p.substock]) grupos[p.substock]={substock:p.substock, prods:[]};
    grupos[p.substock].prods.push(p);
  });
  let html = '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;margin:10px 0 6px">Venta directa</div>';
  Object.values(grupos).forEach(g=>{
    const kg = getSS(g.substock);
    const ssDef = findSSdef(g.substock);
    const low = kg <= 0.5 && kg > 0;
    const zero = kg <= 0;
    html += '<div class="substk '+(low?'substk-low':'')+(zero?' substk-zero':'')+'">'+
      '<div style="flex:1">'+
        '<span style="font-size:12px;'+(zero?'color:#a32d2d':low?'color:#854f0b':'')+'">'+(zero?'⚠ ':'')+
          (ssDef?ssDef.label:g.substock)+'</span>'+
        '<div style="font-size:10px;color:#888;margin-top:2px">'+g.prods.map(p=>p.nombre).join(' · ')+'</div>'+
      '</div>'+
      '<span style="font-size:12px;font-weight:500;color:'+(zero?'#a32d2d':low?'#854f0b':'#333')+'">'+fmt(kg,2)+' kg</span>'+
    '</div>';
  });
  return html;
}

function buildGruposVentas(ventas){
  const grupos=[];const vistoBatch=new Set();const vistoSingle=new Map();
  ventas.map((v,i)=>({...v,_idx:i})).reverse().forEach(v=>{
    if(v.batch_id){
      if(vistoBatch.has(v.batch_id))return;
      vistoBatch.add(v.batch_id);
      const del=ventas.filter((vv,i)=>vv.batch_id===v.batch_id).map((vv,i)=>({...vv,_idx:ventas.indexOf(vv)}));
      grupos.push({tipo:'batch',batch_id:v.batch_id,fecha:v.fecha,items:del});
    } else {
      const k=v.fecha+'|'+v.producto;
      if(!vistoSingle.has(k)){vistoSingle.set(k,{tipo:'single',fecha:v.fecha,producto:v.producto,items:[]});grupos.push(vistoSingle.get(k));}
      vistoSingle.get(k).items.push(v);
    }
  });
  return grupos;
}

function buscarProductoPorNombrePDF(nombrePDF){
  const n = nombrePDF.toLowerCase().trim();
  // Primero buscar en productos M1
  let found = DB.productos.find(p=>{
    const sn = (p.stockNombre||'').toLowerCase();
    const nm = (p.nombre||'').toLowerCase();
    return sn && n.includes(sn.split(' - ')[0].toLowerCase()) ||
           nm && n.includes(nm.split(' - ')[0].toLowerCase()) ||
           sn === n || nm === n;
  });
  if(!found){
    // Buscar en productosM2
    found = (DB.productosM2||[]).find(p=>{
      const nm = (p.nombre||'').toLowerCase();
      return nm === n || n.includes(nm.split(' - ')[0].toLowerCase());
    });
  }
  return found || null;
}

// Mapeos manuales de nombres frecuentes del PDF → ptKey o nombre del sistema
const PDF_NOMBRE_MAP = {
  'ternera braseada al horno': 'Ternera braseada 150g',
  'tiras de res con hongos': 'Tiras cuadril hongos 170g',
  'tiras de cuadril con vegetales': 'Tiras cuadril veg 300g',
  'pollo teriyaki': 'Pollo teriyaki 300g',
  'pechuga provenzal': 'Pechuga provenzal 250g',
  'pechuga con limón': 'Pechuga limón 250g',
  'pechuga con tomillo': 'Pechuga tomillo 250g',
  'curry de pollo': 'Curry pollo 300g',
  'tiras de pollo con vegetales': 'Tiras pollo veg 300g',
  'solomillo hawaiano': 'Solomillo hawaiano 170g',
  'wrap césar': 'Wrap César',
  'wrap criollo': 'Wrap criollo',
  'wrap italiano': 'Wrap italiano',
  'ensalada césar': 'Ensalada César',
};

function parsearPDFTexto(textoCompleto){
  // Extrae líneas del PDF y busca productos proteicos con cantidad
  // Formato: "Nombre del plato — xN" y debajo "• Proteína (Xgr)"
  const lineas = textoCompleto.split('\n').map(l=>l.trim()).filter(Boolean);
  const resultados = {}; // ptKey -> {prod, unidades, gramaje}
  
  let cantActual = 0;
  for(let i=0; i<lineas.length; i++){
    const l = lineas[i];
    // Detectar línea de cantidad: "Algo — x20" o "Algo — x8"
    const mCant = l.match(/—\s*x(\d+)\s*$/);
    if(mCant){
      cantActual = parseInt(mCant[1]);
      continue;
    }
    // Detectar línea de ingrediente proteico: "• Nombre (Xgr)" o "• Nombre (Xg)"
    const mIngr = l.match(/^[•·]\s*(.+?)\s*\((\d+)\s*g(?:r)?\)/);
    if(mIngr && cantActual > 0){
      const nombreIngr = mIngr[1].trim();
      const gramaje = parseInt(mIngr[2]);
      
      // Ver si es una proteína que conocemos
      const nombreLow = nombreIngr.toLowerCase();
      let prod = null;
      
      // Primero intentar con el mapa directo
      for(const [key, ptKey] of Object.entries(PDF_NOMBRE_MAP)){
        if(nombreLow.includes(key)){
          // Buscar con el gramaje correcto si hay variantes
          prod = DB.productos.find(p=>p.ptKey===ptKey) || 
                 DB.productos.find(p=>p.nombre.toLowerCase().includes(key));
          // Si hay variantes por gramaje, buscar la que más se acerca
          const variantes = DB.productos.filter(p=>p.nombre.toLowerCase().includes(key));
          if(variantes.length > 1){
            const exacta = variantes.find(p=>Math.round(p.kgPorcion*1000)===gramaje);
            if(exacta) prod = exacta;
          }
          break;
        }
      }
      // Si no encontró por mapa, intentar por productosM2
      if(!prod){
        prod = (DB.productosM2||[]).find(p=>p.nombre.toLowerCase().includes(nombreLow.split(' ')[0]));
      }
      
      if(prod){
        const key = prod.ptKey || prod.nombre;
        if(!resultados[key]){
          resultados[key] = {prod, unidades:0, gramaje:prod.kgPorcion*1000, noMatch:[]};
        }
        resultados[key].unidades += cantActual;
      }
      // Si no matcheó, guardarlo como no mapeado (solo si parece proteína)
      // (ignoramos acompañamientos)
    }
    // Reset cantidad si la línea no es ingrediente ni cantidad
    if(!mIngr && !mCant && !l.startsWith('•') && !l.startsWith('·') && l.length > 3){
      // nueva sección de plato, reseteamos
      if(l.match(/—\s*x\d+/)) cantActual = 0;
    }
  }
  return resultados;
}

async function procesarPDFM2(){
  const fileInput = document.getElementById('m2-pdf-file');
  const fecha = document.getElementById('m2-fecha')?.value||today();
  const prev = document.getElementById('m2-preview');
  const loading = document.getElementById('m2-loading');
  if(!fileInput||!fileInput.files||!fileInput.files[0]){
    prev.innerHTML='<div class="alert-row">Seleccioná un PDF primero.</div>';return;
  }
  loading.style.display='block';
  prev.innerHTML='';
  try{
    const pdfjsLib=window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const arrayBuffer=await fileInput.files[0].arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    let textoCompleto='';
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const tc=await page.getTextContent();
      let lastY=null;
      for(const item of tc.items){
        const y=item.transform[5];
        if(lastY!==null&&Math.abs(y-lastY)>2) textoCompleto+='\n';
        textoCompleto+=item.str;
        lastY=y;
      }
      textoCompleto+='\n';
    }
    loading.style.display='none';
    const resultados=parsearPDFTexto(textoCompleto);
    const items=Object.values(resultados);
    if(items.length===0){
      prev.innerHTML='<div class="alert-row">No se encontraron proteínas conocidas en el PDF. Verificá que el PDF sea el correcto.</div>';
      return;
    }
    const porSubstock={};
    items.forEach(it=>{
      const ss=it.prod.substock;
      const kgTeo=it.prod.kgPorcion*it.unidades;
      if(!porSubstock[ss])porSubstock[ss]={label:'',kg:0};
      const ssDef=findSSdef(ss);
      porSubstock[ss].label=ssDef?ssDef.label:ss;
      porSubstock[ss].kg+=kgTeo;
    });
    const totalU=items.reduce((a,i)=>a+i.unidades,0);
    const totalKg=items.reduce((a,i)=>a+(i.prod.kgPorcion*i.unidades),0);
    window._m2ImportData={items,fecha};
    prev.innerHTML=`
    <div style="margin-top:4px">
      <div style="font-size:11px;font-weight:500;color:#0c447c;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">✅ Productos encontrados (${items.length})</div>
      <table style="margin-bottom:12px">
        <thead><tr><th>Producto</th><th>Unidades</th><th>Kg teórico</th><th>Sub-stock</th></tr></thead>
        <tbody>${items.map(it=>{
          const kgTeo=it.prod.kgPorcion*it.unidades;
          const ssDef=findSSdef(it.prod.substock);
          return '<tr><td>'+it.prod.nombre+'</td><td style="text-align:center;font-weight:600">'+it.unidades+'</td><td style="text-align:center">'+fmt(kgTeo,3)+' kg</td><td style="color:#888;font-size:11px">'+(ssDef?ssDef.label:it.prod.substock)+'</td></tr>';
        }).join('')}</tbody>
      </table>
      <div style="background:#e6f1fb;border-radius:8px;padding:10px 14px;margin-bottom:12px">
        <div style="font-size:11px;font-weight:500;color:#0c447c;margin-bottom:6px">Resumen teórico por sub-stock (referencia para cocina)</div>
        ${Object.entries(porSubstock).map(([ss,d])=>'<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #c7dff5"><span>'+d.label+'</span><strong>'+fmt(d.kg,3)+' kg teórico</strong></div>').join('')}
        <div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;font-weight:600">
          <span>Total: ${totalU} unidades</span>
          <span>${fmt(totalKg,3)} kg teórico total</span>
        </div>
      </div>
      <button class="btn btn-primary" onclick="confirmarDespachoM2()">✅ Confirmar despacho</button>
    </div>`;
  }catch(e){
    loading.style.display='none';
    prev.innerHTML='<div class="alert-row">Error al leer el PDF: '+(e.message||e)+'. Verificá que sea un PDF válido.</div>';
  }
}

function confirmarDespachoM2(){
  const {items} = window._m2ImportData||{};
  if(!items||items.length===0) return;
  // Leer la fecha del input en el momento de confirmar (no la del procesamiento)
  const fecha = document.getElementById('m2-fecha')?.value || today();
  
  const despachoItems = items.map(it=>({
    nombre: it.prod.nombre,
    ptKey: it.prod.ptKey,
    substock: it.prod.substock,
    unidades: it.unidades,
    kgTeorico: it.prod.kgPorcion * it.unidades,
    kgPorcion: it.prod.kgPorcion,
  }));
  
  const despacho = {
    id: Date.now(),
    fecha,
    items: despachoItems,
    usuario: CU.nombre,
  };
  
  if(!DB.despachosM2) DB.despachosM2=[];
